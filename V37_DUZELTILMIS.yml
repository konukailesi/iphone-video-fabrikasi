name: Minik Kasifler V3.7 - Gercekci Tuylu Karakterler

on:
  workflow_dispatch:
    inputs:
      bolum:
        description: 'Bolum'
        type: choice
        required: true
        default: kayip_balonlar
        options:
          - kayip_balonlar
      ses_profili:
        description: 'Ses profili'
        type: choice
        required: true
        default: A
        options:
          - A
          - B
      mod:
        description: 'Tam video veya ses testi'
        type: choice
        required: true
        default: video
        options:
          - video
          - ses_testi

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BOLUM: ${{ inputs.bolum }}
      SES_PROFILI: ${{ inputs.ses_profili }}
      MOD: ${{ inputs.mod }}
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.11 kur
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Node.js kur
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: FFmpeg ve font kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Pocket TTS kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pocket-tts-turkish
      - name: Remotion kur
        run: |
          npm init -y
          npm install --no-audit --no-fund remotion @remotion/cli react react-dom
      - name: Sahne gorsellerini dosyadan cikar
