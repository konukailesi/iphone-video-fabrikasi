      - name: Video kaynak kodunu olustur
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src public outputs
          cat > src/tts_v37.py <<'PYEND'
          import json, math, os, struct, wave
          from pathlib import Path
          from pocket_tts_turkish import TurkishTTS, save_wav
          
          lesson = os.getenv('BOLUM', 'kayip_balonlar')
          profile = os.getenv('SES_PROFILI', 'A')
          mode = os.getenv('MOD', 'video')
          
          # One visual frame per line, real asset images embedded in workflow.
          lessons = {
            'kayip_balonlar': [
              ('tavsan','şaşkın','Civciv! Üç balonum uçmuş! Bana yardım eder misin?','Kayıp Balonlar','problem'),
              ('tavsan','şaşkın','Aaa, balonlar gökyüzüne yükseliyor!','Balonlar Uçuyor','problem'),
              ('civciv','mutlu','Bak! Kırmızı balonu çalıların arasında buldum!','Kırmızı','found'),
              ('tavsan','mutlu','Yaşasın! Kırmızı balon artık bizimle!','Kırmızı Balon','found'),
              ('tavsan','sakin','Mavi balon nerede? Sen görebiliyor musun?','Mavi Nerede?','question'),
              ('civciv','mutlu','İşte burada! Oyuncak evin yanında!','Mavi Balon','found'),
              ('tavsan','sakin','Son balon sarı! Nerede olabilir?','Sarı Nerede?','question'),
              ('civciv','mutlu','Sarı balon da burada! Yaşasın!','Sarı Balon','found'),
              ('tavsan','mutlu','Kırmızı, mavi, sarı! Üç balonu da bulduk. Aferin!','Üç Balon','celebrate'),
            ],
            'sayi_treni': [
              ('tavsan','mutlu','Sayı treni geliyor!','Sayı Treni','intro'),
              ('civciv','mutlu','Bir! Bir tane vagon!','Bir','count'),
              ('tavsan','mutlu','İki! İki tane vagon!','İki','count'),
              ('civciv','mutlu','Üç! Üç tane vagon!','Üç','count'),
              ('tavsan','mutlu','Bir, iki, üç! Bravo!','Bravo','celebrate'),
            ],
            'hayvan_dostlar': [
              ('tavsan','mutlu','Hayvan dostlarımızı tanıyalım!','Hayvan Dostlar','intro'),
              ('civciv','mutlu','Miyav! Bu bir kedi!','Kedi','found'),
              ('tavsan','mutlu','Hav hav! Bu bir köpek!','Köpek','found'),
              ('civciv','mutlu','Cik cik! Bu bir civciv!','Civciv','found'),
              ('tavsan','mutlu','Kedi, köpek, civciv! Aferin!','Harika','celebrate'),
            ],
          }
          
          if lesson not in lessons or profile not in ('A','B') or mode not in ('video','ses_testi'):
            raise SystemExit('Geçersiz giriş')
          
          lines = lessons[lesson]
          # The curated 9-image illustrated story is intentionally only for Kayıp Balonlar.
          if lesson != 'kayip_balonlar':
            raise SystemExit('Bu görsel pilot yalnızca kayip_balonlar içindir. Önce gerçekçi görsellerini hazırlamalıyız.')
          if mode == 'ses_testi':
            lines = [lines[0], lines[2]]
          voices = {'A':{'tavsan':'female_1','civciv':'female_2'}, 'B':{'tavsan':'female_2','civciv':'female_3'}}
          Path('public').mkdir(exist_ok=True)
          
          print('Pocket TTS yükleniyor...',flush=True)
          model = TurkishTTS.from_pretrained(device='cpu')
          
          def make_fx(path, frequency):
            sr=44100
            with wave.open(str(path),'wb') as wav:
              wav.setnchannels(1); wav.setsampwidth(2); wav.setframerate(sr)
              buf=bytearray()
              for i in range(int(sr*0.22)):
                t=i/sr
                envelope=min(1,t*70)*max(0,1-t/0.22)
                s=math.sin(2*math.pi*(frequency+500*t)*t)*envelope*0.18
                buf.extend(struct.pack('<h',int(max(-1,min(1,s))*32767)))
              wav.writeframes(buf)
          make_fx('public/find.wav',740)
          make_fx('public/celebrate.wav',580)
          
          output=[]
          for i,(who,emotion,speech,title,mood) in enumerate(lines):
            print(f'Ses {i+1}/{len(lines)}: {who} - {emotion}',flush=True)
            data=model.generate(speech,voice=voices[profile][who],emotion=emotion,seed=300+i)
            p=Path(f'public/audio_{i:02}.wav')
            save_wav(str(p),data,model.sample_rate)
            with wave.open(str(p),'rb') as wav:
              length=wav.getnframes()/wav.getframerate()
            if length <= 0.1:
              raise ValueError(f'Boş ses dosyası: {p}')
            seconds=max(3.25,length + (1.15 if mood=='question' else 0.52))
            output.append({
              'id':i,'who':who,'speech':speech,'title':title,'mood':mood,
              'image': f'v37/shot_{(i if mode == "video" else (0 if i == 0 else 2))+1:02d}.jpg',
              'audio':f'audio_{i:02}.wav','durationInFrames':math.ceil(seconds*30),
            })
          Path('src/scenes-data.json').write_text(json.dumps(output,ensure_ascii=False,indent=2),encoding='utf-8')
          print('Sahne sayısı:',len(output),'toplam saniye:',sum(s['durationInFrames'] for s in output)/30,flush=True)
          PYEND
          cat > src/index.jsx <<'JSEND'
          import React from 'react';
          import {AbsoluteFill, Audio, Composition, Img, Sequence, staticFile, useCurrentFrame, interpolate, spring, useVideoConfig, registerRoot} from 'remotion';
          import scenes from './scenes-data.json';
          
          const FPS = 30;
          const TOTAL = scenes.reduce((a,s)=>a+s.durationInFrames,0);
          const clamp = {extrapolateLeft:'clamp',extrapolateRight:'clamp'};
          
          const Palette = ({scene}) => {
            const frame=useCurrentFrame();
            const {fps}=useVideoConfig();
            const entrance=spring({frame,fps,config:{damping:15,stiffness:85}});
            const zoom=interpolate(frame,[0,scene.durationInFrames],[1.02,1.18],clamp);
            const sway=Math.sin(frame/19)*12;
            const subjectX=[-12,-60,0,-20,-100,-36,0,-10,0][scene.id%9];
            const reveal=interpolate(frame,[0,9],[0,1],clamp);
            return <AbsoluteFill style={{background:'#9edff4',overflow:'hidden'}}>
              {/* Blurred full-bleed background taken from the actual generated 3D illustration. */}
              <Img src={staticFile(scene.image)} style={{position:'absolute',width:'100%',height:'100%',objectFit:'cover',filter:'blur(34px) brightness(0.93) saturate(1.18)',transform:`scale(1.85) translateX(${sway*0.06}px)`}}/>
              <div style={{position:'absolute',inset:0,background:'linear-gradient(180deg,rgba(20,48,83,.08),rgba(255,255,255,0) 22%,rgba(255,255,255,.02) 60%,rgba(18,35,69,.24))'}}/>
              {/* This is a real 3D-look animal illustration, not an SVG approximation. */}
              <div style={{position:'absolute',top:330,left:-40,width:800,height:510,borderRadius:35,overflow:'hidden',boxShadow:'0 30px 70px rgba(11,41,75,.35)',transform:`translateY(${(1-entrance)*40}px)`,opacity:reveal}}>
                <Img src={staticFile(scene.image)} style={{height:'100%',width:'100%',objectFit:'cover',transform:`scale(${zoom}) translateX(${subjectX*0.22 + sway*0.07}px)`}} />
                <div style={{position:'absolute',inset:0,border:'7px solid rgba(255,255,255,.6)',borderRadius:35,pointerEvents:'none'}} />
              </div>
              <div style={{position:'absolute',top:75,left:42,right:42,background:'rgba(255,255,255,.9)',borderRadius:32,padding:'18px 28px',textAlign:'center',boxShadow:'0 12px 28px rgba(0,0,0,.10)'}}>
                <div style={{fontSize:23,fontWeight:900,color:'#3c76bc',letterSpacing:1}}>MİNİK KAŞİFLER</div>
                <div style={{fontSize:52,fontWeight:900,lineHeight:1.12,color:'#223d69'}}>{scene.title}</div>
              </div>
              <div style={{position:'absolute',bottom:82,left:36,right:36,borderRadius:33,background:'#fff',padding:'28px 30px',boxShadow:'0 15px 30px rgba(9,31,54,.20)'}}>
                <div style={{fontSize:22,color:'#6883ae',fontWeight:800,marginBottom:9}}>{scene.who==='tavsan'?'🐰 MAVİ TAVŞAN':'🐥 SARI CİVCİV'}</div>
                <div style={{fontSize:37,lineHeight:1.24,color:'#243c60',fontWeight:800}}>{scene.speech}</div>
              </div>
              <Audio src={staticFile(scene.audio)} />
              {scene.mood==='found' ? <Audio src={staticFile('find.wav')} volume={0.17}/> : null}
              {scene.mood==='celebrate' ? <Audio src={staticFile('celebrate.wav')} volume={0.18}/> : null}
              <div style={{position:'absolute',bottom:15,left:38,right:38,height:7,background:'#ffffff66',borderRadius:20,overflow:'hidden'}}><div style={{height:'100%',width:`${((frame+1)/scene.durationInFrames)*100}%`,background:'#fff'}}/></div>
            </AbsoluteFill>;
          };
          const Film=()=>{
            let cursor=0;
            return <AbsoluteFill>{scenes.map(scene=>{const from=cursor;cursor+=scene.durationInFrames;return <Sequence key={scene.id} from={from} durationInFrames={scene.durationInFrames}><Palette scene={scene}/></Sequence>})}</AbsoluteFill>;
          };
          const Root=()=><Composition id="MinikKasiflerV37" component={Film} durationInFrames={TOTAL} fps={FPS} width={720} height={1280}/>;
          registerRoot(Root);
          JSEND

      - name: Sesleri hazirla
        shell: bash
        run: |
          set -euo pipefail
          python src/tts_v37.py
          test -s src/scenes-data.json
          test -s public/audio_00.wav
          test -s public/v37/shot_01.jpg

      - name: MP4 render ve dogrulama
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="outputs/${BOLUM}-${SES_PROFILI}-${MOD}-v37.mp4"
          npx remotion render src/index.jsx MinikKasiflerV37 "$OUTPUT" --codec=h264 --concurrency=2
          test -s "$OUTPUT"
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=noprint_wrappers=1 "$OUTPUT" | grep -q h264
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of default=noprint_wrappers=1 "$OUTPUT" | grep -q audio
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 "$OUTPUT"
      - name: MP4 ve ses dosyalarini yukle
        uses: actions/upload-artifact@v6
        with:
          name: minik-kasifler-v37-${{ inputs.bolum }}-${{ inputs.ses_profili }}-${{ inputs.mod }}
          path: |
            outputs/*.mp4
            public/*.wav
            src/scenes-data.json
          if-no-files-found: error
          retention-days: 7
