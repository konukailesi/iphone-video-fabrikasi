name: Minik Kasifler - Gercek Hayvanlar 3D Video
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/minik-gercek-hayvan-video.yml'
      - '3d-studio/real-models/real_video.py'
permissions:
  contents: read
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Blender sistemini kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy ffmpeg libegl1 libgl1 libopengl0 libgbm1 libgl1-mesa-dri xvfb git-lfs
      - name: Gercek ve lisansli iki 3D hayvan modelini indir
        run: |
          set -euo pipefail
          mkdir -p /tmp/models outputs
          curl -fLsS --retry 3 'https://polyfork.dev/cdn/forest-rabbit-ea2da0.glb' -o /tmp/models/forest.glb
          test "$(stat -c%s /tmp/models/forest.glb)" -gt 100000
          git clone --depth 1 https://github.com/chickensoft-games/Chicken.git /tmp/Chicken
          git -C /tmp/Chicken lfs pull
          cp /tmp/Chicken/chickensoft_mascot_model.blend /tmp/models/chickensoft_mascot_model.blend
          test "$(stat -c%s /tmp/models/chickensoft_mascot_model.blend)" -gt 100000
      - name: Gercek yuruyus animasyonlarini render et
        run: |
          set -euo pipefail
          PREVIEW_ONLY=1 LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a blender -b -t 2 --python 3d-studio/real-models/real_video.py
          test -s outputs/preview.png
      - name: MP4 dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: minik-kasifler-gercek-3d-kadraj-test
          path: outputs/*.png
          if-no-files-found: error
          retention-days: 7
