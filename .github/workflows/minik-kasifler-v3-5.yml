name: Minik Kasifler V3.5 - Hareketli Karakterler

on:
  workflow_dispatch:
    inputs:
      bolum:
        description: 'Pilot bolum'
        type: choice
        required: true
        default: kayip_balonlar
        options:
          - kayip_balonlar
          - sayi_treni
          - hayvan_dostlar
      ses_profili:
        description: 'Karakter ses profili'
        type: choice
        required: true
        default: A
        options:
          - A
          - B
      mod:
        description: 'Test veya tam video'
        type: choice
        required: true
        default: video
        options:
          - ses_testi
          - video

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      BOLUM: ${{ inputs.bolum }}
      SES_PROFILI: ${{ inputs.ses_profili }}
      MOD: ${{ inputs.mod }}
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Node kur
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: FFmpeg kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          ffmpeg -version | head -n 1

      - name: Pocket TTS kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pocket-tts-turkish

      - name: Remotion kur
        run: |
          npm init -y
          npm install --no-audit --no-fund remotion @remotion/cli react react-dom

      - name: V3.5 proje dosyalarini olustur
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src public outputs

          cat > src/tts_v34.py <<'PYEND'
          import json, math, os, wave
          from pathlib import Path
          from pocket_tts_turkish import TurkishTTS, save_wav

          lesson = os.getenv('BOLUM', 'kayip_balonlar')
          profile = os.getenv('SES_PROFILI', 'A')
          mode = os.getenv('MOD', 'video')

          lessons = {
            'kayip_balonlar': [
              {'who':'tavsan','emotion':'sasirma','speech':'Aaa! Üç balonum kaybolmuş! Bana yardım eder misin?','title':'Kayıp Balonlar','subtitle':'Balonları bulalım!','bg':'garden_morning','item':'none','mood':'problem'},
              {'who':'civciv','emotion':'mutlu','speech':'Bak! Çalının yanında kırmızı bir balon var!','title':'Kırmızı Balon','subtitle':'Kırmızıyı bulduk.','bg':'garden_bush','item':'red_balloon','mood':'found'},
              {'who':'tavsan','emotion':'merakli','speech':'Harika! Peki mavi balon nerede? Hadi göster!','title':'Mavi Balon Nerede?','subtitle':'Düşün ve göster.','bg':'garden_house','item':'blue_balloon_hidden','mood':'question'},
              {'who':'civciv','emotion':'mutlu','speech':'İşte burada! Oyuncak evin yanında mavi balon!','title':'Mavi Balon','subtitle':'Maviyi de bulduk.','bg':'garden_house','item':'blue_balloon','mood':'found'},
              {'who':'tavsan','emotion':'merakli','speech':'Bir balon daha kaldı. Sarı balonu bulabilecek misin?','title':'Sarı Balon','subtitle':'Haydi ara.','bg':'garden_sun','item':'yellow_balloon_hidden','mood':'question'},
              {'who':'civciv','emotion':'coskulu','speech':'Yaşasın! Sarı balon da burada!','title':'Sarı Balon','subtitle':'Üçüncü balon bulundu.','bg':'garden_sun','item':'yellow_balloon','mood':'found'},
              {'who':'tavsan','emotion':'mutlu','speech':'Şimdi sayalım: bir, iki, üç balon! Çok iyi iş çıkardın!','title':'Bir İki Üç','subtitle':'Üç balon saydık.','bg':'garden_party','item':'three_balloons','mood':'celebrate'},
            ],
            'sayi_treni': [
              {'who':'tavsan','emotion':'mutlu','speech':'Sayı treni geliyor! Bugün birden üçe kadar sayacağız!','title':'Sayı Treni','subtitle':'Haydi başlayalım.','bg':'train_start','item':'train','mood':'intro'},
              {'who':'civciv','emotion':'sakin','speech':'Bir yıldız! Sadece bir tane.','title':'Bir','subtitle':'1 yıldız','bg':'train_one','item':'one_star','mood':'count'},
              {'who':'tavsan','emotion':'mutlu','speech':'Şimdi iki yıldız! Bir, iki!','title':'İki','subtitle':'2 yıldız','bg':'train_two','item':'two_stars','mood':'count'},
              {'who':'civciv','emotion':'coskulu','speech':'Ve üç yıldız! Bir, iki, üç!','title':'Üç','subtitle':'3 yıldız','bg':'train_three','item':'three_stars','mood':'count'},
              {'who':'tavsan','emotion':'mutlu','speech':'Harika saydın! Bir, iki, üç! Bravo!','title':'Bravo','subtitle':'Sayıları öğrendik.','bg':'train_party','item':'three_stars','mood':'celebrate'},
            ],
            'hayvan_dostlar': [
              {'who':'tavsan','emotion':'mutlu','speech':'Hayvan dostlarımız saklanmış. Hadi bulalım!','title':'Hayvan Dostlar','subtitle':'Kimler burada?','bg':'farm_intro','item':'none','mood':'intro'},
              {'who':'civciv','emotion':'coskulu','speech':'Miyav! Bu bir kedi!','title':'Kedi','subtitle':'Miyav miyav.','bg':'farm_cat','item':'cat','mood':'found'},
              {'who':'tavsan','emotion':'mutlu','speech':'Hav hav! Bu da köpek!','title':'Köpek','subtitle':'Hav hav.','bg':'farm_dog','item':'dog','mood':'found'},
              {'who':'civciv','emotion':'mutlu','speech':'Cik cik! İşte civciv!','title':'Civciv','subtitle':'Cik cik.','bg':'farm_chick','item':'chick','mood':'found'},
              {'who':'tavsan','emotion':'coskulu','speech':'Kedi, köpek ve civciv! Hepsini öğrendin!','title':'Hepsini Bulduk','subtitle':'Aferin!','bg':'farm_party','item':'all_animals','mood':'celebrate'},
            ],
          }

          test_dialogue = [
            {'who':'tavsan','emotion':'mutlu','speech':'Merhaba! Ben Mavi Tavşan. Bugün birlikte öğreneceğiz!','title':'Mavi Tavşan','subtitle':'Ses testi','bg':'test_blue','item':'none','mood':'intro'},
            {'who':'civciv','emotion':'coskulu','speech':'Ben de Sarı Civciv! Yaşasın, oyun zamanı!','title':'Sarı Civciv','subtitle':'Ses testi','bg':'test_yellow','item':'none','mood':'intro'},
          ]

          if lesson not in lessons:
            raise SystemExit('Gecersiz bolum secimi')
          if profile not in ('A', 'B'):
            raise SystemExit('Gecersiz ses profili')
          if mode not in ('video', 'ses_testi'):
            raise SystemExit('Gecersiz mod')

          base = test_dialogue if mode == 'ses_testi' else lessons[lesson]
          voice_profiles = {
            'A': {'tavsan':'female_1', 'civciv':'female_2'},
            'B': {'tavsan':'female_2', 'civciv':'female_3'},
          }
          emotion_map = {
            'mutlu':'mutlu',
            'coskulu':'mutlu',
            'sakin':'sakin',
            'merakli':'sakin',
            'sasirma':'şaşkın',
          }

          print('Pocket TTS modeli yukleniyor...', flush=True)
          model = TurkishTTS.from_pretrained(device='cpu')
          Path('public').mkdir(exist_ok=True)
          Path('src').mkdir(exist_ok=True)
          Path('outputs').mkdir(exist_ok=True)

          scenes = []
          for idx, s in enumerate(base):
            voice = voice_profiles[profile][s['who']]
            emotion = emotion_map.get(s['emotion'], 'mutlu')
            print(f"Ses uretimi {idx+1}/{len(base)}: {s['who']} - {voice} - {emotion}", flush=True)
            audio = model.generate(s['speech'], voice=voice, emotion=emotion, seed=100 + idx)
            wav_path = f'public/scene_{idx}.wav'
            save_wav(wav_path, audio, model.sample_rate)
            with wave.open(wav_path, 'rb') as wf:
              duration = wf.getnframes() / wf.getframerate()
            if duration < 0.25:
              raise RuntimeError(f'Ses dosyasi olusmadi: {wav_path}')
            hold = 1.6 if s['mood'] == 'question' else 0.5
            total_seconds = max(2.8, duration + hold)
            scenes.append({
              'id': idx,
              'who': s['who'],
              'speech': s['speech'],
              'title': s['title'],
              'subtitle': s['subtitle'],
              'bg': s['bg'],
              'item': s['item'],
              'mood': s['mood'],
              'audio': f'scene_{idx}.wav',
              'durationInFrames': math.ceil(total_seconds * 30),
            })

          Path('src/scenes-data.json').write_text(
            json.dumps(scenes, ensure_ascii=False, indent=2),
            encoding='utf-8'
          )
          print('Toplam sahne:', len(scenes), flush=True)

          # Tamamen ozgun, kisa balon bulma efekti.
          import struct, math
          sample_rate=24000
          samples=[]
          for n in range(int(sample_rate*0.24)):
            t=n/sample_rate
            env=(1-t/0.24)**2
            tone=math.sin(2*math.pi*(620*t+170*t*t))
            samples.append(int(9500*env*tone))
          with wave.open('public/pop.wav','wb') as wf:
            wf.setnchannels(1)
            wf.setsampwidth(2)
            wf.setframerate(sample_rate)
            wf.writeframes(struct.pack('<'+'h'*len(samples),*samples))
          PYEND

          cat > src/index.jsx <<'JSEND'
          import React from 'react';
          import {AbsoluteFill,Audio,Composition,Sequence,staticFile,useCurrentFrame,interpolate,registerRoot} from 'remotion';
          import scenes from './scenes-data.json';
          
          const TOTAL=scenes.reduce((n,s)=>n+s.durationInFrames,0);
          const PAL={sky:'#92d5ff',grass:'#8edc79',ink:'#363854',red:'#f35c69',blue:'#5c9ff5',yellow:'#ffcb45'};
          const ease=(f,a,b)=>interpolate(f,[a,b],[0,1],{extrapolateLeft:'clamp',extrapolateRight:'clamp'});
          const titleStyle={position:'absolute',top:78,left:45,right:45,textAlign:'center',fontSize:49,fontFamily:'DejaVu Sans, Arial, sans-serif',fontWeight:900,color:'#303957',textShadow:'0 3px 0 rgba(255,255,255,.8)'};
          
          function World({scene,f}) {
           const isFarm=scene.bg.startsWith('farm');
           const isTrain=scene.bg.startsWith('train');
           const sky=scene.bg.includes('party')?'#b5d1ff':isFarm?'#b9e9ff':'#9ddcff';
           return <AbsoluteFill style={{background:`linear-gradient(${sky} 0%,#f2faff 74%,#a5e998 74%)`}}>
             <svg width="720" height="1280" viewBox="0 0 720 1280" style={{position:'absolute',inset:0}}>
              <defs><linearGradient id="hill" x1="0" x2="0" y1="0" y2="1"><stop stopColor="#a7ed8b"/><stop offset="1" stopColor="#62ba68"/></linearGradient></defs>
              <circle cx="585" cy="180" r="65" fill="#ffdf6e" opacity=".9"/>
              <g fill="white" opacity=".9" transform={`translate(${Math.sin(f/45)*11} 0)`}>
                <ellipse cx="128" cy="200" rx="86" ry="31"/><circle cx="100" cy="171" r="39"/><circle cx="158" cy="166" r="48"/>
                <ellipse cx="515" cy="310" rx="80" ry="25"/><circle cx="480" cy="287" r="31"/><circle cx="530" cy="278" r="41"/>
              </g>
              <path d="M0 910 Q180 835 360 910 T720 895 V1280 H0Z" fill="url(#hill)"/>
              <path d="M0 1020 Q200 985 420 1010 T720 1005" fill="none" stroke="#6fc66b" strokeWidth="15" opacity=".8"/>
              {[45,200,335,515,675].map((x,i)=><g key={i} transform={`translate(${x} ${995+(i%2)*60})`}><path d="M0 0V30" stroke="#4eae55" strokeWidth="6"/><circle cx="0" cy="0" r="12" fill={['#f6a0bd','#fff18d','#bb9bef'][i%3]}/><circle cx="0" cy="0" r="5" fill="#ffe57c"/></g>)}
              {(!isTrain&&!isFarm)&&<g transform="translate(550 690)"><path d="M0 60L85 -14L170 60Z" fill="#ff738f" stroke="#e95c75" strokeWidth="6"/><rect x="8" y="55" width="154" height="145" rx="13" fill="#ffcf93" stroke="#e6a562" strokeWidth="7"/><rect x="64" y="120" width="55" height="80" rx="12" fill="#b47e65"/><circle cx="110" cy="159" r="5" fill="#ffe4b1"/><rect x="23" y="77" width="40" height="40" rx="8" fill="#a0dfff"/></g>}
              {isFarm&&<g transform="translate(460 650)"><path d="M0 65L100 -20L205 65Z" fill="#e77d7b"/><rect x="8" y="65" width="192" height="220" rx="8" fill="#e9af82"/><path d="M75 285V130H140V285" fill="#af705b"/></g>}
              {isTrain&&<g transform={`translate(${80+Math.sin(f/12)*10} 730)`}>{[0,1,2].map((n)=><g key={n} transform={`translate(${n*155} 0)`}><rect x="0" y="20" width="145" height="95" rx="20" fill={['#ff9db4','#7cb9f8','#ffce66'][n]} stroke="white" strokeWidth="8"/><text x="70" y="92" textAnchor="middle" fontSize="60" fontWeight="bold" fill="#323b57">{n+1}</text><circle cx="30" cy="120" r="20" fill="#525f7c"/><circle cx="110" cy="120" r="20" fill="#525f7c"/></g>)}</g>}
              <g transform="translate(35 870)"><circle cx="45" cy="20" r="63" fill="#47bb64"/><circle cx="98" cy="30" r="61" fill="#3da857"/><circle cx="150" cy="30" r="67" fill="#55c76d"/></g>
             </svg>
           </AbsoluteFill>;
          }
          
          function Rabbit({f,active,mood}) {
           const blink=(f%105)<4;
           const hop=active?Math.abs(Math.sin(f/13))*18:Math.sin(f/25)*3;
           const travel=active?(mood==='found'?Math.min(38,f*1.0):Math.sin(f/16)*10):0;
           const mouth=active&&f%12<6;
           return <svg viewBox="0 0 275 365" width="275" height="365" style={{position:'absolute',left:23,bottom:145,overflow:'visible',transform:`translate(${travel}px,${-hop}px)`}}>
            <ellipse cx="86" cy="78" rx="25" ry="89" fill="#76bef7" transform="rotate(-10 86 78)"/><ellipse cx="170" cy="75" rx="25" ry="94" fill="#76bef7" transform="rotate(10 170 75)"/>
            <ellipse cx="86" cy="80" rx="11" ry="68" fill="#f5b3d5" transform="rotate(-10 86 80)"/><ellipse cx="170" cy="80" rx="11" ry="67" fill="#f5b3d5" transform="rotate(10 170 80)"/>
            <ellipse cx="132" cy="286" rx="81" ry="73" fill="#7fc5f7" stroke="#539ddc" strokeWidth="5"/><ellipse cx="132" cy="292" rx="46" ry="55" fill="#f3fbff"/>
            <ellipse cx="128" cy="176" rx="98" ry="92" fill="#8bd0ff" stroke="#539ddc" strokeWidth="5"/>
            <ellipse cx="80" cy="164" rx="15" ry={blink?3:20} fill="#304766"/><ellipse cx="176" cy="164" rx="15" ry={blink?3:20} fill="#304766"/>
            {!blink&&<><circle cx="85" cy="156" r="5" fill="white"/><circle cx="181" cy="156" r="5" fill="white"/></>}
            <ellipse cx="128" cy="202" rx="48" ry="32" fill="#eff9ff"/><path d="M119 197 Q128 183 138 197 Q129 206 119 197" fill="#f48fac"/>
            {mouth?<ellipse cx="128" cy="225" rx="13" ry="18" fill="#8e4468"/>:<path d="M112 217 Q128 232 144 217" fill="none" stroke="#384b6a" strokeWidth="5" strokeLinecap="round"/>}
            <ellipse cx="57" cy="196" rx="18" ry="12" fill="#f6b5d0" opacity=".8"/><ellipse cx="200" cy="196" rx="18" ry="12" fill="#f6b5d0" opacity=".8"/>
            <ellipse cx="66" cy="292" rx="28" ry="21" fill="#7fc5f7" transform={`rotate(${active?Math.sin(f/6)*18:-12} 66 292)`}/><ellipse cx="207" cy="288" rx="28" ry="21" fill="#7fc5f7" transform={`rotate(${active?Math.sin(f/6)*-18:12} 207 288)`}/>
            <ellipse cx="83" cy="345" rx="37" ry="18" fill="#ecf9ff"/><ellipse cx="174" cy="345" rx="37" ry="18" fill="#ecf9ff"/>
           </svg>;
          }
          
          function Chick({f,active}) {
           const blink=f%113<4, mouth=active&&f%10<5;
           const hop=active?Math.abs(Math.sin(f/11))*21:Math.sin(f/29)*3;
           return <svg viewBox="0 0 260 330" width="260" height="330" style={{position:'absolute',right:22,bottom:150,overflow:'visible',transform:`translateY(${-hop}px)`}}>
            <ellipse cx="128" cy="241" rx="91" ry="84" fill="#ffdc49" stroke="#eeba39" strokeWidth="5"/>
            <ellipse cx="129" cy="142" rx="84" ry="80" fill="#ffe468" stroke="#eeba39" strokeWidth="5"/>
            <path d="M105 70Q84 40 113 28Q141 26 139 67Q153 35 172 49Q186 65 158 83" fill="#ffd43e"/>
            <ellipse cx="95" cy="143" rx="13" ry={blink?3:18} fill="#38465c"/><ellipse cx="157" cy="143" rx="13" ry={blink?3:18} fill="#38465c"/>
            {!blink&&<><circle cx="98" cy="138" r="4" fill="white"/><circle cx="160" cy="138" r="4" fill="white"/></>}
            <path d={mouth?'M113 172L142 172L128 203Z':'M112 172L145 172L128 189Z'} fill="#f49348"/>
            <ellipse cx="72" cy="175" rx="17" ry="10" fill="#ffb96b" opacity=".75"/><ellipse cx="185" cy="175" rx="17" ry="10" fill="#ffb96b" opacity=".75"/>
            <ellipse cx="48" cy="241" rx="28" ry="48" fill="#f7ca36" transform={`rotate(${active?Math.sin(f/7)*15:15} 48 241)`}/><ellipse cx="207" cy="241" rx="28" ry="48" fill="#f7ca36" transform={`rotate(${active?Math.sin(f/7)*-15:-15} 207 241)`}/>
            <path d="M105 315V327M151 315V327" stroke="#d98b3b" strokeWidth="8" strokeLinecap="round"/>
           </svg>;
          }
          
          function Balloon({x,y,color,f,delay=0,hidden=false}) {
           const appear=ease(f,delay,delay+18), float=Math.sin((f-delay)/13)*8;
           return <svg width="125" height="255" viewBox="0 0 125 255" style={{position:'absolute',left:x,top:y,opacity:hidden?.22:appear,transform:`translateY(${float}px) scale(${hidden?.85:.8+appear*.2})`,transformOrigin:'center bottom'}}>
            <path d="M62 128Q52 180 66 250" stroke="#7b7585" fill="none" strokeWidth="3"/>
            <ellipse cx="62" cy="67" rx="54" ry="66" fill={color} stroke="#ffffff" strokeWidth="4"/>
            <ellipse cx="39" cy="43" rx="12" ry="26" fill="white" opacity=".42" transform="rotate(25 39 43)"/>
            <path d="M62 129l-11 15h22Z" fill={color}/>
           </svg>;
          }
          
          function Star({x,y,f,delay=0}) {
           const scale=.55+Math.min(1,ease(f,delay,delay+16))*.45;
           return <svg viewBox="0 0 110 110" width="110" height="110" style={{position:'absolute',left:x,top:y,transform:`scale(${scale}) rotate(${Math.sin(f/17)*7}deg)`}}><path d="M55 6L69 39L104 43L78 65L86 102L55 84L24 102L32 65L6 43L41 39Z" fill="#ffcf4d" stroke="white" strokeWidth="6"/></svg>;
          }
          
          function Extras({scene,f}) {
           const item=scene.item;
           if(item==='red_balloon')return <Balloon x={475} y={490} color={PAL.red} f={f} delay={12}/>;
           if(item==='blue_balloon'||item==='blue_balloon_hidden')return <Balloon x={485} y={470} color={PAL.blue} f={f} hidden={item.includes('hidden')} delay={10}/>;
           if(item==='yellow_balloon'||item==='yellow_balloon_hidden')return <Balloon x={490} y={470} color={PAL.yellow} f={f} hidden={item.includes('hidden')} delay={8}/>;
           if(item==='three_balloons')return <><Balloon x={312} y={450} color={PAL.red} f={f}/><Balloon x={430} y={420} color={PAL.blue} f={f} delay={8}/><Balloon x={544} y={450} color={PAL.yellow} f={f} delay={16}/></>;
           const count={one_star:1,two_stars:2,three_stars:3}[item];
           if(count)return <>{Array.from({length:count}).map((_,i)=><Star key={i} x={320+i*116} y={480} f={f} delay={i*12}/>)}</>;
           const animal={cat:'🐱',dog:'🐶',chick:'🐥',all_animals:'🐱 🐶 🐥'}[item];
           if(animal)return <div style={{position:'absolute',top:400,left:280,right:30,fontSize:item==='all_animals'?70:145,textAlign:'center',transform:`translateY(${Math.sin(f/15)*9}px)`}}>{animal}</div>;
           return null;
          }
          
          function Caption({scene,f}) {
           const enter=ease(f,0,12);
           return <div style={{position:'absolute',left:40,right:40,bottom:42,background:'rgba(255,255,255,.96)',border:'5px solid #ffffff',borderRadius:35,padding:'16px 24px',boxShadow:'0 14px 34px #496c7444',transform:`translateY(${(1-enter)*90}px)`}}>
             <div style={{color:'#65758a',fontSize:19,fontWeight:800,fontFamily:'DejaVu Sans,Arial'}}>{scene.who==='tavsan'?'MAVİ TAVŞAN':'SARI CİVCİV'}</div>
             <div style={{color:'#293753',fontSize:29,fontWeight:800,lineHeight:1.2,fontFamily:'DejaVu Sans,Arial',marginTop:4}}>{scene.speech}</div>
           </div>;
          }
          
          function Scene({scene}) {
           const f=useCurrentFrame();
           const hero=scene.who;
           const active=scene.mood==='found'||scene.mood==='celebrate';
           return <AbsoluteFill>
            <World scene={scene} f={f}/>
            <div style={{...titleStyle}}>{scene.title}</div>
            <Extras scene={scene} f={f}/>
            <Rabbit f={f} active={hero==='tavsan'} mood={scene.mood}/>
            <Chick f={f} active={hero==='civciv'}/>
            {active&&<svg viewBox="0 0 720 1280" style={{position:'absolute',inset:0,pointerEvents:'none'}}>{Array.from({length:8}).map((_,i)=>{
             const x=(i*103+29)%700, y=300+(i%4)*125;
             return <circle key={i} cx={x} cy={y} r={5+(i%3)*4} fill={i%2?'#ffe383':'#ff99bd'} opacity={.25+.5*Math.abs(Math.sin((f+i*7)/17))}/>;
            })}</svg>}
            <Caption scene={scene} f={f}/>
            <Audio src={staticFile(scene.audio)} volume={1}/>
            {active&&<Sequence from={Math.min(12,Math.floor(scene.durationInFrames/5))} durationInFrames={Math.max(1,scene.durationInFrames-Math.min(12,Math.floor(scene.durationInFrames/5)))}><Audio src={staticFile('pop.wav')} volume={0.2}/></Sequence>}
           </AbsoluteFill>;
          }
          function Film() {
           let t=0;
           return <AbsoluteFill>{scenes.map((scene)=>{
            const from=t;t+=scene.durationInFrames;
            return <Sequence key={scene.id} from={from} durationInFrames={scene.durationInFrames}><Scene scene={scene}/></Sequence>;
           })}</AbsoluteFill>;
          }
          registerRoot(()=> <Composition id="MinikKasiflerV35" component={Film} durationInFrames={TOTAL} fps={30} width={720} height={1280}/>);
          JSEND

      - name: Sesleri ve sahneleri hazirla
        shell: bash
        run: |
          set -euo pipefail
          python src/tts_v34.py
          test -s src/scenes-data.json
          test -s public/scene_0.wav
          test -s public/pop.wav

      - name: MP4 olustur
        shell: bash
        run: |
          set -euo pipefail
          OUT="outputs/${BOLUM}-${SES_PROFILI}-${MOD}-v35.mp4"
          npx remotion render src/index.jsx MinikKasiflerV35 "$OUT" --codec=h264 --concurrency=2
          test -s "$OUT"
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=noprint_wrappers=1 "$OUT" | grep -q h264
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of default=noprint_wrappers=1 "$OUT" | grep -q audio

      - name: MP4 ve WAV dosyalarini yukle
        uses: actions/upload-artifact@v6
        with:
          name: minik-kasifler-v35-${{ inputs.bolum }}-${{ inputs.ses_profili }}-${{ inputs.mod }}
          path: |
            outputs/*.mp4
            public/*.wav
            src/scenes-data.json
          if-no-files-found: error
          retention-days: 7
