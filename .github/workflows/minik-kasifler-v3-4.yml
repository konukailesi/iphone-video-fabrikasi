name: Minik Kasifler V3.4 - Cizgi Film Pilot

on:
  workflow_dispatch:
    inputs:
      bolum:
        description: 'Pilot bolum'
        type: choice
        required: true
        default: kayip_balonlar
        options:
          - kayip_balonlar
          - sayi_treni
          - hayvan_dostlar
      ses_profili:
        description: 'Karakter ses profili'
        type: choice
        required: true
        default: A
        options:
          - A
          - B
      mod:
        description: 'Test veya tam video'
        type: choice
        required: true
        default: video
        options:
          - ses_testi
          - video

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      BOLUM: ${{ inputs.bolum }}
      SES_PROFILI: ${{ inputs.ses_profili }}
      MOD: ${{ inputs.mod }}
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Node kur
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: FFmpeg kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          ffmpeg -version | head -n 1

      - name: Pocket TTS kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pocket-tts-turkish

      - name: Remotion kur
        run: |
          npm init -y
          npm install --no-audit --no-fund remotion @remotion/cli react react-dom

      - name: V3.4 proje dosyalarini olustur
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src public outputs

          cat > src/tts_v34.py <<'PYEND'
          import json, math, os, wave
          from pathlib import Path
          from pocket_tts_turkish import TurkishTTS, save_wav

          lesson = os.getenv('BOLUM', 'kayip_balonlar')
          profile = os.getenv('SES_PROFILI', 'A')
          mode = os.getenv('MOD', 'video')

          lessons = {
            'kayip_balonlar': [
              {'who':'tavsan','emotion':'sasirma','speech':'Aaa! Üç balonum kaybolmuş! Bana yardım eder misin?','title':'Kayıp Balonlar','subtitle':'Balonları bulalım!','bg':'garden_morning','item':'none','mood':'problem'},
              {'who':'civciv','emotion':'mutlu','speech':'Bak! Çalının yanında kırmızı bir balon var!','title':'Kırmızı Balon','subtitle':'Kırmızıyı bulduk.','bg':'garden_bush','item':'red_balloon','mood':'found'},
              {'who':'tavsan','emotion':'merakli','speech':'Harika! Peki mavi balon nerede? Hadi göster!','title':'Mavi Balon Nerede?','subtitle':'Düşün ve göster.','bg':'garden_house','item':'blue_balloon_hidden','mood':'question'},
              {'who':'civciv','emotion':'mutlu','speech':'İşte burada! Oyuncak evin yanında mavi balon!','title':'Mavi Balon','subtitle':'Maviyi de bulduk.','bg':'garden_house','item':'blue_balloon','mood':'found'},
              {'who':'tavsan','emotion':'merakli','speech':'Bir balon daha kaldı. Sarı balonu bulabilecek misin?','title':'Sarı Balon','subtitle':'Haydi ara.','bg':'garden_sun','item':'yellow_balloon_hidden','mood':'question'},
              {'who':'civciv','emotion':'coskulu','speech':'Yaşasın! Sarı balon da burada!','title':'Sarı Balon','subtitle':'Üçüncü balon bulundu.','bg':'garden_sun','item':'yellow_balloon','mood':'found'},
              {'who':'tavsan','emotion':'mutlu','speech':'Şimdi sayalım: bir, iki, üç balon! Çok iyi iş çıkardın!','title':'Bir İki Üç','subtitle':'Üç balon saydık.','bg':'garden_party','item':'three_balloons','mood':'celebrate'},
            ],
            'sayi_treni': [
              {'who':'tavsan','emotion':'mutlu','speech':'Sayı treni geliyor! Bugün birden üçe kadar sayacağız!','title':'Sayı Treni','subtitle':'Haydi başlayalım.','bg':'train_start','item':'train','mood':'intro'},
              {'who':'civciv','emotion':'sakin','speech':'Bir yıldız! Sadece bir tane.','title':'Bir','subtitle':'1 yıldız','bg':'train_one','item':'one_star','mood':'count'},
              {'who':'tavsan','emotion':'mutlu','speech':'Şimdi iki yıldız! Bir, iki!','title':'İki','subtitle':'2 yıldız','bg':'train_two','item':'two_stars','mood':'count'},
              {'who':'civciv','emotion':'coskulu','speech':'Ve üç yıldız! Bir, iki, üç!','title':'Üç','subtitle':'3 yıldız','bg':'train_three','item':'three_stars','mood':'count'},
              {'who':'tavsan','emotion':'mutlu','speech':'Harika saydın! Bir, iki, üç! Bravo!','title':'Bravo','subtitle':'Sayıları öğrendik.','bg':'train_party','item':'three_stars','mood':'celebrate'},
            ],
            'hayvan_dostlar': [
              {'who':'tavsan','emotion':'mutlu','speech':'Hayvan dostlarımız saklanmış. Hadi bulalım!','title':'Hayvan Dostlar','subtitle':'Kimler burada?','bg':'farm_intro','item':'none','mood':'intro'},
              {'who':'civciv','emotion':'coskulu','speech':'Miyav! Bu bir kedi!','title':'Kedi','subtitle':'Miyav miyav.','bg':'farm_cat','item':'cat','mood':'found'},
              {'who':'tavsan','emotion':'mutlu','speech':'Hav hav! Bu da köpek!','title':'Köpek','subtitle':'Hav hav.','bg':'farm_dog','item':'dog','mood':'found'},
              {'who':'civciv','emotion':'mutlu','speech':'Cik cik! İşte civciv!','title':'Civciv','subtitle':'Cik cik.','bg':'farm_chick','item':'chick','mood':'found'},
              {'who':'tavsan','emotion':'coskulu','speech':'Kedi, köpek ve civciv! Hepsini öğrendin!','title':'Hepsini Bulduk','subtitle':'Aferin!','bg':'farm_party','item':'all_animals','mood':'celebrate'},
            ],
          }

          test_dialogue = [
            {'who':'tavsan','emotion':'mutlu','speech':'Merhaba! Ben Mavi Tavşan. Bugün birlikte öğreneceğiz!','title':'Mavi Tavşan','subtitle':'Ses testi','bg':'test_blue','item':'none','mood':'intro'},
            {'who':'civciv','emotion':'coskulu','speech':'Ben de Sarı Civciv! Yaşasın, oyun zamanı!','title':'Sarı Civciv','subtitle':'Ses testi','bg':'test_yellow','item':'none','mood':'intro'},
          ]

          if lesson not in lessons:
            raise SystemExit('Gecersiz bolum secimi')
          if profile not in ('A', 'B'):
            raise SystemExit('Gecersiz ses profili')
          if mode not in ('video', 'ses_testi'):
            raise SystemExit('Gecersiz mod')

          base = test_dialogue if mode == 'ses_testi' else lessons[lesson]
          voice_profiles = {
            'A': {'tavsan':'female_1', 'civciv':'female_2'},
            'B': {'tavsan':'female_2', 'civciv':'female_3'},
          }
          emotion_map = {
            'mutlu':'mutlu',
            'coskulu':'mutlu',
            'sakin':'sakin',
            'merakli':'sakin',
            'sasirma':'sasirma',
          }

          print('Pocket TTS modeli yukleniyor...', flush=True)
          model = TurkishTTS.from_pretrained(device='cpu')
          Path('public').mkdir(exist_ok=True)
          Path('src').mkdir(exist_ok=True)
          Path('outputs').mkdir(exist_ok=True)

          scenes = []
          for idx, s in enumerate(base):
            voice = voice_profiles[profile][s['who']]
            emotion = emotion_map.get(s['emotion'], 'mutlu')
            print(f"Ses uretimi {idx+1}/{len(base)}: {s['who']} - {voice} - {emotion}", flush=True)
            audio = model.generate(s['speech'], voice=voice, emotion=emotion, seed=100 + idx)
            wav_path = f'public/scene_{idx}.wav'
            save_wav(wav_path, audio, model.sample_rate)
            with wave.open(wav_path, 'rb') as wf:
              duration = wf.getnframes() / wf.getframerate()
            if duration < 0.25:
              raise RuntimeError(f'Ses dosyasi olusmadi: {wav_path}')
            hold = 0.8 if s['mood'] in ('question', 'problem') else 0.55
            total_seconds = max(4.0, duration + hold)
            scenes.append({
              'id': idx,
              'who': s['who'],
              'speech': s['speech'],
              'title': s['title'],
              'subtitle': s['subtitle'],
              'bg': s['bg'],
              'item': s['item'],
              'mood': s['mood'],
              'audio': f'scene_{idx}.wav',
              'durationInFrames': math.ceil(total_seconds * 30),
            })

          Path('src/scenes-data.js').write_text(
            'const scenes = ' + json.dumps(scenes, ensure_ascii=False, indent=2) + ';\nexport default scenes;\n',
            encoding='utf-8'
          )
          print('Toplam sahne:', len(scenes), flush=True)
          PYEND

          cat > src/index.jsx <<'JSEND'
          import React from 'react';
          import {
            AbsoluteFill,
            Audio,
            Composition,
            Sequence,
            staticFile,
            interpolate,
            useCurrentFrame,
            spring,
            useVideoConfig,
            registerRoot,
          } from 'remotion';
          import scenes from './scenes-data.js';

          const totalDuration = scenes.reduce((sum, s) => sum + s.durationInFrames, 0);

          const Sky = ({bg}) => {
            const gradients = {
              garden_morning: ['#9be2ff', '#e7fbff'],
              garden_bush: ['#9bd3ff', '#d6f6ff'],
              garden_house: ['#98cbff', '#e7f4ff'],
              garden_sun: ['#8fd0ff', '#fff3b1'],
              garden_party: ['#82ccff', '#ffdbf3'],
              train_start: ['#88d6ff', '#e7fbff'],
              train_one: ['#a8dbff', '#fff0c7'],
              train_two: ['#8ccaff', '#e8f5ff'],
              train_three: ['#8fd0ff', '#fff5c8'],
              train_party: ['#85ccff', '#ffd8ef'],
              farm_intro: ['#9dd8ff', '#f3ffe8'],
              farm_cat: ['#9ad0ff', '#fff1dd'],
              farm_dog: ['#97ccff', '#fbe5d0'],
              farm_chick: ['#a5d8ff', '#fff6be'],
              farm_party: ['#96d1ff', '#ffe2f4'],
              test_blue: ['#9ad7ff', '#eef9ff'],
              test_yellow: ['#ffe59e', '#fff8d8'],
            };
            const [c1, c2] = gradients[bg] || gradients.garden_morning;
            return <AbsoluteFill style={{background: `linear-gradient(180deg, ${c1}, ${c2})`}} />;
          };

          const Cloud = ({left, top, scale = 1}) => (
            <div style={{position:'absolute', left, top, transform:`scale(${scale})`, opacity:0.9}}>
              <div style={{width:110, height:46, borderRadius:30, background:'#fff', position:'relative'}}>
                <div style={{position:'absolute', width:45, height:45, borderRadius:999, background:'#fff', left:8, top:-18}} />
                <div style={{position:'absolute', width:58, height:58, borderRadius:999, background:'#fff', left:34, top:-28}} />
                <div style={{position:'absolute', width:42, height:42, borderRadius:999, background:'#fff', left:70, top:-12}} />
              </div>
            </div>
          );

          const Ground = () => (
            <>
              <div style={{position:'absolute', left:0, right:0, bottom:0, height:250, background:'#8fe07d'}} />
              <div style={{position:'absolute', left:0, right:0, bottom:210, height:90, background:'#74cb66', borderTopLeftRadius:120, borderTopRightRadius:120}} />
            </>
          );

          const Bush = ({left, bottom, scale = 1}) => (
            <div style={{position:'absolute', left, bottom, transform:`scale(${scale})`}}>
              {[0, 36, 70].map((x, i) => (
                <div key={i} style={{position:'absolute', left:x, bottom:0, width:62, height:54, borderRadius:999, background:i === 1 ? '#39a951' : '#2f9747'}} />
              ))}
            </div>
          );

          const ToyHouse = () => (
            <div style={{position:'absolute', right:85, bottom:190, width:150, height:130}}>
              <div style={{position:'absolute', inset:0, background:'#ffd39d', borderRadius:24, border:'6px solid #f8b46e'}} />
              <div style={{position:'absolute', left:18, right:18, top:-42, height:70, background:'#ff7d8e', clipPath:'polygon(50% 0%, 100% 100%, 0% 100%)'}} />
              <div style={{position:'absolute', left:48, bottom:0, width:54, height:68, background:'#fff0ce', borderTopLeftRadius:20, borderTopRightRadius:20}} />
            </div>
          );

          const Balloon = ({color, left, top, hidden = false, bob = 0}) => (
            <div style={{position:'absolute', left, top, opacity:hidden ? 0.23 : 1}}>
              <div style={{width:82, height:102, background:color, borderRadius:'50% 50% 48% 48%', transform:`translateY(${bob}px)`}} />
              <div style={{margin:'0 auto', width:8, height:14, background:color, borderRadius:6}} />
              <div style={{margin:'0 auto', width:2, height:100, background:'#7b5b3d'}} />
            </div>
          );

          const StarGroup = ({count}) => (
            <div style={{position:'absolute', right:90, top:240, display:'flex', gap:18}}>
              {Array.from({length:count}).map((_, i) => (
                <div key={i} style={{fontSize:84}}>⭐</div>
              ))}
            </div>
          );

          const AnimalCard = ({kind}) => {
            const map = {
              cat: ['🐱', 'Kedi'],
              dog: ['🐶', 'Köpek'],
              chick: ['🐥', 'Civciv'],
              all_animals: ['🐱 🐶 🐥', 'Arkadaşlar'],
            };
            const [emoji, label] = map[kind] || ['🐾', 'Hayvan'];
            return (
              <div style={{position:'absolute', right:80, top:210, width:240, height:240, borderRadius:34, background:'#ffffffcc', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', color:'#2f2f5b'}}>
                <div style={{fontSize:110}}>{emoji}</div>
                <div style={{fontSize:34, fontWeight:800}}>{label}</div>
              </div>
            );
          };

          const Character = ({who, speaking}) => {
            const frame = useCurrentFrame();
            const {fps} = useVideoConfig();
            const bounce = spring({frame, fps, config:{damping:12, stiffness:100}});
            const y = speaking ? Math.sin(frame / 7) * 6 : Math.sin(frame / 18) * 2;
            const isRabbit = who === 'tavsan';
            return (
              <div style={{position:'absolute', left:isRabbit ? 64 : undefined, right:isRabbit ? undefined : 64, bottom:140, width:250, height:300, transform:`translateY(${y}px) scale(${0.96 + bounce * 0.04})`}}>
                {isRabbit ? (
                  <svg viewBox="0 0 250 300" width="250" height="300">
                    <ellipse cx="84" cy="42" rx="22" ry="66" fill="#89c6ff" />
                    <ellipse cx="132" cy="42" rx="22" ry="66" fill="#89c6ff" />
                    <ellipse cx="84" cy="48" rx="10" ry="46" fill="#ffd3ea" />
                    <ellipse cx="132" cy="48" rx="10" ry="46" fill="#ffd3ea" />
                    <circle cx="108" cy="118" r="72" fill="#9ed4ff" />
                    <ellipse cx="108" cy="214" rx="62" ry="56" fill="#9ed4ff" />
                    <circle cx="82" cy="110" r="10" fill="#24395a" />
                    <circle cx="134" cy="110" r="10" fill="#24395a" />
                    <ellipse cx="108" cy="137" rx="24" ry="16" fill="#ffffff" />
                    <circle cx="108" cy="132" r="7" fill="#ff7cab" />
                    <path d="M95 144 Q108 156 121 144" stroke="#24395a" strokeWidth="4" fill="none" strokeLinecap="round" />
                    <circle cx="62" cy="188" r="18" fill="#9ed4ff" />
                    <circle cx="154" cy="188" r="18" fill="#9ed4ff" />
                    <circle cx="72" cy="250" r="18" fill="#ffffff" opacity="0.85" />
                    <circle cx="144" cy="250" r="18" fill="#ffffff" opacity="0.85" />
                  </svg>
                ) : (
                  <svg viewBox="0 0 250 300" width="250" height="300">
                    <ellipse cx="128" cy="164" rx="72" ry="82" fill="#ffd84d" />
                    <circle cx="126" cy="100" r="52" fill="#ffe15a" />
                    <circle cx="108" cy="96" r="9" fill="#2d2d56" />
                    <circle cx="146" cy="96" r="9" fill="#2d2d56" />
                    <path d="M126 108 L108 124 L144 124 Z" fill="#ff9b3e" />
                    <circle cx="166" cy="70" r="16" fill="#ffd84d" />
                    <circle cx="182" cy="56" r="14" fill="#ffd84d" />
                    <circle cx="112" cy="214" r="12" fill="#ffca35" />
                    <circle cx="148" cy="214" r="12" fill="#ffca35" />
                    <path d="M104 236 L90 260" stroke="#ff9b3e" strokeWidth="6" strokeLinecap="round" />
                    <path d="M152 236 L166 260" stroke="#ff9b3e" strokeWidth="6" strokeLinecap="round" />
                  </svg>
                )}
              </div>
            );
          };

          const SpeechBubble = ({text, who, subtitle}) => {
            const left = who === 'tavsan' ? 210 : 80;
            const right = who === 'tavsan' ? 80 : 210;
            return (
              <div style={{position:'absolute', left, right, bottom:70, background:'#ffffff', borderRadius:34, padding:'20px 24px', boxShadow:'0 12px 30px rgba(0,0,0,0.14)', color:'#2d2d56'}}>
                <div style={{fontSize:20, fontWeight:800, color:'#556'}}>{subtitle}</div>
                <div style={{fontSize:33, lineHeight:1.28, fontWeight:700}}>{text}</div>
              </div>
            );
          };

          const SceneVisuals = ({scene}) => {
            const frame = useCurrentFrame();
            const bob = Math.sin(frame / 10) * 6;
            const bg = scene.bg;
            return (
              <>
                <Sky bg={bg} />
                <Cloud left={60} top={75} scale={1} />
                <Cloud left={430} top={120} scale={0.8} />
                <Ground />
                <Bush left={48} bottom={170} />
                <Bush left={520} bottom={170} scale={0.9} />
                {bg.includes('house') && <ToyHouse />}
                {scene.item === 'red_balloon' && <Balloon color="#ef4444" left={500} top={170} bob={bob} />}
                {scene.item === 'blue_balloon' && <Balloon color="#2563eb" left={520} top={160} bob={bob} />}
                {scene.item === 'yellow_balloon' && <Balloon color="#facc15" left={510} top={150} bob={bob} />}
                {scene.item === 'blue_balloon_hidden' && <Balloon color="#2563eb" left={520} top={160} bob={bob} hidden />}
                {scene.item === 'yellow_balloon_hidden' && <Balloon color="#facc15" left={510} top={150} bob={bob} hidden />}
                {scene.item === 'three_balloons' && <>
                  <Balloon color="#ef4444" left={430} top={132} bob={bob} />
                  <Balloon color="#2563eb" left={515} top={114} bob={-bob} />
                  <Balloon color="#facc15" left={598} top={144} bob={bob} />
                </>}
                {bg.startsWith('train_') && (
                  <div style={{position:'absolute', left:230, bottom:160, width:360, height:130}}>
                    {[0,1,2].map((n) => (
                      <div key={n} style={{position:'absolute', left:n*110, bottom:0, width:96, height:76, background:n === 0 ? '#ff8fa2' : n === 1 ? '#73b7ff' : '#ffd45c', borderRadius:18, border:'5px solid #ffffff'}}>
                        <div style={{position:'absolute', left:28, top:12, fontSize:34, fontWeight:800, color:'#334'}}>{n+1}</div>
                        <div style={{position:'absolute', left:16, bottom:-20, width:20, height:20, borderRadius:99, background:'#3d445c'}} />
                        <div style={{position:'absolute', right:16, bottom:-20, width:20, height:20, borderRadius:99, background:'#3d445c'}} />
                      </div>
                    ))}
                    <div style={{position:'absolute', left:-70, bottom:14, width:64, height:44, borderRadius:16, background:'#7c3aed'}} />
                  </div>
                )}
                {scene.item === 'one_star' && <StarGroup count={1} />}
                {scene.item === 'two_stars' && <StarGroup count={2} />}
                {scene.item === 'three_stars' && <StarGroup count={3} />}
                {scene.item === 'cat' && <AnimalCard kind="cat" />}
                {scene.item === 'dog' && <AnimalCard kind="dog" />}
                {scene.item === 'chick' && <AnimalCard kind="chick" />}
                {scene.item === 'all_animals' && <AnimalCard kind="all_animals" />}
              </>
            );
          };

          const Scene = ({scene}) => {
            return (
              <AbsoluteFill>
                <SceneVisuals scene={scene} />
                <div style={{position:'absolute', top:36, left:36, background:'#ffffffbb', borderRadius:20, padding:'10px 18px', color:'#2d2d56', fontWeight:800, fontSize:30}}>{scene.title}</div>
                <Character who="tavsan" speaking={scene.who === 'tavsan'} />
                <Character who="civciv" speaking={scene.who === 'civciv'} />
                <SpeechBubble text={scene.speech} subtitle={scene.subtitle} who={scene.who} />
                <Audio src={staticFile(scene.audio)} />
              </AbsoluteFill>
            );
          };

          const Video = () => {
            let start = 0;
            return (
              <AbsoluteFill>
                {scenes.map((scene) => {
                  const from = start;
                  start += scene.durationInFrames;
                  return (
                    <Sequence key={scene.id} from={from} durationInFrames={scene.durationInFrames}>
                      <Scene scene={scene} />
                    </Sequence>
                  );
                })}
              </AbsoluteFill>
            );
          };

          const Root = () => (
            <Composition id="MinikKasiflerV34" component={Video} durationInFrames={totalDuration} fps={30} width={720} height={1280} />
          );

          registerRoot(Root);
          JSEND

      - name: Sesleri ve sahneleri hazirla
        shell: bash
        run: |
          set -euo pipefail
          python src/tts_v34.py
          test -s src/scenes-data.js
          test -s public/scene_0.wav

      - name: MP4 olustur
        shell: bash
        run: |
          set -euo pipefail
          OUT="outputs/${BOLUM}-${SES_PROFILI}-${MOD}-v34.mp4"
          npx remotion render src/index.jsx MinikKasiflerV34 "$OUT" --codec=h264 --concurrency=2
          test -s "$OUT"
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=noprint_wrappers=1 "$OUT" | grep -q h264
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of default=noprint_wrappers=1 "$OUT" | grep -q audio

      - name: MP4 ve WAV dosyalarini yukle
        uses: actions/upload-artifact@v6
        with:
          name: minik-kasifler-v34-${{ inputs.bolum }}-${{ inputs.ses_profili }}-${{ inputs.mod }}
          path: |
            outputs/*.mp4
            public/*.wav
            src/scenes-data.js
          if-no-files-found: error
          retention-days: 7
