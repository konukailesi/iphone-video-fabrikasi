name: Cocuk Video Fabrikasi - iPhone

on:
  workflow_dispatch:
    inputs:
      kategori:
        description: Video turu
        type: choice
        default: karisik
        required: true
        options:
          - karisik
          - renkler
          - sayilar
          - hayvanlar
          - sekiller
      adet:
        description: Video sayisi (1-30)
        type: number
        default: 3
        required: true

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      KATEGORI: ${{ inputs.kategori }}
      ADET: ${{ inputs.adet }}
    steps:
      - name: Node.js 24 kur
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: PACKAGE_JSON dosyasini olustur
        run: |
          cat > package.json <<'__PACKAGE_JSON__'
          {
            "name": "iphone-cocuk-video-fabrikasi",
            "version": "1.0.0",
            "private": true,
            "type": "module",
            "scripts": {"render": "node render.mjs"},
            "dependencies": {
              "@remotion/cli": "4.0.415",
              "remotion": "4.0.415",
              "react": "18.3.1",
              "react-dom": "18.3.1"
            }
          }
          __PACKAGE_JSON__
      - name: SRC_JSX dosyasini olustur
        run: |
          cat > src.jsx <<'__SRC_JSX__'
          import React from 'react';
          import {AbsoluteFill, Composition, Easing, interpolate, registerRoot, useCurrentFrame} from 'remotion';
          
          const colors = {renkler:'#FF7A91', sayilar:'#7F83FF', hayvanlar:'#25BAA1', sekiller:'#F2A93B'};
          const subjects = {renkler:'RENKLER',sayilar:'SAYILAR',hayvanlar:'HAYVANLAR',sekiller:'ŞEKİLLER'};
          const fade = (f,a,b) => interpolate(f,[a,b],[0,1],{extrapolateLeft:'clamp',extrapolateRight:'clamp'});
          const pop = (f,a) => interpolate(f,[a,a+17],[0.65,1],{extrapolateLeft:'clamp',extrapolateRight:'clamp',easing:Easing.out(Easing.back(1.7))});
          
          function Cat(){return <svg viewBox="0 0 400 400" width="400" height="400"><path d="M96 150 L100 60 L168 115 Q200 105 232 115 L300 60 L304 150 Q355 196 326 284 Q299 356 200 356 Q101 356 74 284 Q45 195 96 150Z" fill="#FFBE73" stroke="#8A4B28" strokeWidth="13" strokeLinejoin="round"/><ellipse cx="144" cy="220" rx="17" ry="23" fill="#46302A"/><ellipse cx="256" cy="220" rx="17" ry="23" fill="#46302A"/><path d="M184 267Q200 290 216 267L200 252Z" fill="#D85C7B"/><path d="M200 283Q185 306 165 292M200 283Q215 306 235 292" fill="none" stroke="#77442E" strokeWidth="9" strokeLinecap="round"/><path d="M120 273H40M125 297L47 318M280 273H360M275 297L353 318" stroke="#77442E" strokeWidth="7" strokeLinecap="round"/></svg>}
          function Fish(){return <svg viewBox="0 0 400 400" width="400" height="400"><path d="M90 197L22 119V284L90 213" fill="#4E9FF4" stroke="#1E609A" strokeWidth="10" strokeLinejoin="round"/><ellipse cx="210" cy="204" rx="138" ry="98" fill="#52BDF6" stroke="#1E609A" strokeWidth="10"/><path d="M181 115L219 57L253 112" fill="#77D1FF" stroke="#1E609A" strokeWidth="9"/><circle cx="279" cy="187" r="16" fill="#173C68"/><path d="M299 227Q284 250 264 239" fill="none" stroke="#173C68" strokeWidth="8" strokeLinecap="round"/><path d="M160 177Q200 204 160 232" fill="none" stroke="#1E609A" strokeWidth="10"/></svg>}
          function Chick(){return <svg viewBox="0 0 400 400" width="400" height="400"><circle cx="200" cy="210" r="140" fill="#FFE56D" stroke="#B58A29" strokeWidth="10"/><circle cx="151" cy="186" r="17" fill="#4B382A"/><circle cx="249" cy="186" r="17" fill="#4B382A"/><path d="M172 221L200 247L228 221Z" fill="#F49144"/><ellipse cx="109" cy="241" rx="22" ry="13" fill="#FFA2A5"/><ellipse cx="291" cy="241" rx="22" ry="13" fill="#FFA2A5"/><path d="M164 71L190 30L208 76L237 38" fill="none" stroke="#B58A29" strokeWidth="12" strokeLinecap="round"/></svg>}
          function Animal({kind}){return kind==='kedi'?<Cat/>:kind==='balik'?<Fish/>:<Chick/>;}
          function Shape({kind,color}) {const common={fill:color,stroke:'#ffffff',strokeWidth:12};return <svg viewBox="0 0 360 360" width="360" height="360">{kind==='daire'?<circle cx="180" cy="180" r="140" {...common}/>:kind==='kare'?<rect x="43" y="43" width="274" height="274" rx="24" {...common}/>:<path d="M180 34 L332 310 H28 Z" strokeLinejoin="round" {...common}/>}</svg>}
          const RoundText=({children,size=60,color='#23405B'})=><div style={{fontSize:size,fontWeight:900,lineHeight:1.15,color,textAlign:'center',fontFamily:'Arial, sans-serif',overflowWrap:'anywhere'}}>{children}</div>;
          const Video=({category='renkler',title='Kırmızı',word='KIRMIZI',detail='Kırmızı rengi öğrenelim!',symbol='renk',tone='#FF5964',count=1})=>{
            const f=useCurrentFrame();const theme=colors[category]||colors.renkler;
            const wiggle=Math.sin(f/13)*6;
            const mainOpacity=fade(f,22,43)*(1-fade(f,360,395));
            return <AbsoluteFill style={{background:'#FCFAF2',overflow:'hidden',fontFamily:'Arial, sans-serif'}}>
              <div style={{position:'absolute',top:-190,left:-130,width:590,height:540,borderRadius:'50%',background:theme,opacity:0.17}}/>
              <div style={{position:'absolute',bottom:-140,right:-120,width:540,height:490,borderRadius:'50%',background:theme,opacity:0.2}}/>
              <div style={{position:'absolute',top:70,left:55,right:55,background:'white',padding:'22px 28px',borderRadius:40,boxShadow:'0 8px 25px #22334418',display:'flex',justifyContent:'center'}}><RoundText size={38} color={theme}>MERHABA MİNİKLER! 🌟</RoundText></div>
              <div style={{position:'absolute',top:215,left:60,right:60,opacity:fade(f,0,18),transform:`scale(${pop(f,0)})`}}><RoundText size={78}>{title}</RoundText></div>
              <div style={{position:'absolute',top:475,left:0,right:0,display:'flex',justifyContent:'center',alignItems:'center',height:450,opacity:mainOpacity,transform:`translateY(${wiggle}px) scale(${pop(f,22)})`}}>
              {category==='renkler'?<div style={{width:340,height:340,background:tone,borderRadius:60,boxShadow:'0 20px 0 #273E4B1B',border:'14px solid white'}}/>:category==='sayilar'?<div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:10}}><RoundText size={290} color={theme}>{count}</RoundText><div style={{fontSize:60,letterSpacing:12,color:theme}}>{'● '.repeat(Number(count)||1)}</div></div>:category==='hayvanlar'?<Animal kind={symbol}/>:<Shape kind={symbol} color={tone}/>}
              </div>
              <div style={{position:'absolute',top:925,left:70,right:70,opacity:fade(f,75,95)}}><RoundText size={79} color={theme}>{word}</RoundText><div style={{marginTop:24}}><RoundText size={37}>{detail}</RoundText></div></div>
              <div style={{position:'absolute',bottom:73,left:65,right:65,display:'flex',justifyContent:'center'}}><RoundText size={29} color="#547083">{subjects[category]||'EĞİTİCİ'} • MİNİK ÖĞRENİYOR</RoundText></div>
              <div style={{position:'absolute',inset:0,background:'#FCFAF2',opacity:fade(f,395,425),display:'flex',alignItems:'center',justifyContent:'center',pointerEvents:'none'}}><div style={{opacity:fade(f,405,426),padding:'0 60px'}}><RoundText size={78} color={theme}>HARİKASIN! ⭐</RoundText><div style={{marginTop:30}}><RoundText size={41}>Birlikte yeniden öğrenelim!</RoundText></div></div></div>
            </AbsoluteFill>;
          };
          const Root=()=> <Composition id="CocukShort" component={Video} durationInFrames={450} fps={30} width={720} height={1280} defaultProps={{category:'renkler',title:'Kırmızı',word:'KIRMIZI',detail:'Kırmızı rengi öğrenelim!',symbol:'renk',tone:'#FF5964',count:1}}/>;
          registerRoot(Root);
          __SRC_JSX__
      - name: RENDER_MJS dosyasini olustur
        run: |
          cat > render.mjs <<'__RENDER_MJS__'
          import fs from 'node:fs';
          import path from 'node:path';
          import {spawnSync} from 'node:child_process';
          
          const library={
           renkler:[
            {title:'Kırmızı Renk',word:'KIRMIZI',detail:'Kırmızı bir elma gibi!',tone:'#ED514C'},
            {title:'Mavi Renk',word:'MAVİ',detail:'Masmavi gökyüzü!',tone:'#4596EF'},
            {title:'Sarı Renk',word:'SARI',detail:'Güneş gibi sarı!',tone:'#FBCB35'},
            {title:'Yeşil Renk',word:'YEŞİL',detail:'Çimenler yeşildir!',tone:'#6BC76A'},
            {title:'Mor Renk',word:'MOR',detail:'Mor bir çiçek!',tone:'#AE77CE'},
           ],
           sayilar:[1,2,3,4,5].map(n=>({title:`${n} Sayısını Öğrenelim`,word:`${n} • ${['BİR','İKİ','ÜÇ','DÖRT','BEŞ'][n-1]}`,detail:`Haydi ${n} kez sayalım!`,count:n})),
           hayvanlar:[
            {title:'Miyav Miyav!',word:'KEDİ',detail:'Kedi miyav der.',symbol:'kedi'},
            {title:'Suda Kim Var?',word:'BALIK',detail:'Balık suda yüzer.',symbol:'balik'},
            {title:'Cik Cik!',word:'CİVCİV',detail:'Civciv cik cik der.',symbol:'civciv'},
           ],
           sekiller:[
            {title:'Yuvarlak Daire',word:'DAİRE',detail:'Dairenin köşesi yok!',symbol:'daire',tone:'#E96890'},
            {title:'Dört Kenarlı Kare',word:'KARE',detail:'Karenin dört köşesi var!',symbol:'kare',tone:'#71A8ED'},
            {title:'Üç Köşeli Üçgen',word:'ÜÇGEN',detail:'Üçgenin üç köşesi var!',symbol:'ucgen',tone:'#F4B742'},
           ]
          };
          const requested=String(process.env.KATEGORI||'karisik');
          const keys=Object.keys(library);
          if(requested!=='karisik'&&!keys.includes(requested)){throw new Error('Gecersiz kategori');}
          const raw=Number(process.env.ADET||3);
          if(!Number.isInteger(raw)||raw<1||raw>30){throw new Error('Adet 1-30 arasinda olmali');}
          const categories=requested==='karisik'?keys:[requested];
          fs.mkdirSync('outputs',{recursive:true});
          for (let i=0;i<raw;i++) {
           const category=categories[i%categories.length];
           const templates=library[category];
           const picked=templates[Math.floor(i/categories.length)%templates.length];
           const props={category,...picked};
           const stem=`cocuk_${String(i+1).padStart(2,'0')}_${category}`;
           const propsPath=path.resolve('outputs',`${stem}.json`);
           const videoPath=path.resolve('outputs',`${stem}.mp4`);
           fs.writeFileSync(propsPath,JSON.stringify(props,null,2),'utf8');
           console.log(`VIDEO ${i+1}/${raw}: ${category} - ${picked.title}`);
           const result=spawnSync('npx',['--no-install','remotion','render','src.jsx','CocukShort',videoPath,`--props=${propsPath}`,'--concurrency=1','--log=error'],{stdio:'inherit'});
           if(result.error||result.status!==0){throw new Error(`Video uretilmedi: ${stem}, cikis: ${result.status}, hata: ${result.error||'bilinmiyor'}`);}
           if(!fs.existsSync(videoPath)||fs.statSync(videoPath).size<1000){throw new Error(`MP4 yok veya bos: ${stem}`);}
          }
          console.log(`TAMAMLANDI: ${raw} video hazir.`);
          __RENDER_MJS__
      - name: Kutuphaneleri yukle
        run: npm install --no-audit --no-fund
      - name: Chromium hazirla
        run: npx --no-install remotion browser ensure
      - name: MP4 uret
        run: node render.mjs
      - name: MP4 sayisini dogrula
        run: |
          find outputs -maxdepth 1 -name '*.mp4' -size +1k -print
          test "$(find outputs -maxdepth 1 -name '*.mp4' -size +1k | wc -l)" -eq "$ADET"
      - name: MP4 videolarini ZIP olarak yukle
        uses: actions/upload-artifact@v6
        with:
          name: cocuk-egitici-shorts
          path: outputs/*.mp4
          if-no-files-found: error
          retention-days: 7
