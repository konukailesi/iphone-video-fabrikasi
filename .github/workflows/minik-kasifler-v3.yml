name: Minik Kasifler V3 - DUZELTILMIS
on:
  workflow_dispatch:
    inputs:
      kategori:
        description: Bolum secimi
        type: choice
        required: true
        default: karisik
        options:
          - karisik
          - 01-kayip-balonlar
          - 02-sayi-treni
          - 03-hayvan-dostlar
          - 04-sekil-robotu
          - 05-paylasma-gunu
      adet:
        description: Karisik durumda 1-5 arasi video sayisi
        type: number
        required: true
        default: 2
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      KATEGORI: ${{ inputs.kategori }}
      ADET: ${{ inputs.adet }}
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
      - name: Node.js 24 kur
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Turkce ses motorunu kur
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng
      - name: V3 proje dosyalarini guvenli ac
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode | tar -xz
          test -s src/video.jsx
          test -s src/episodes.mjs
          test -s render.mjs
          echo 'V3 proje dosyalari acildi.'
      - name: Node paketlerini kur
        run: npm install --no-audit --no-fund
      - name: Seslendirme ve MP4 uret
        run: node render.mjs
      - name: MP4 dosyalarini kesin dogrula
        shell: bash
        run: |
          set -euo pipefail
          test -d outputs
          find outputs -maxdepth 1 -name '*.mp4' -size +15k -print
          count=$(find outputs -maxdepth 1 -name '*.mp4' -size +15k | wc -l)
          test "$count" -ge 1 || { echo 'HATA: MP4 olusmadi'; exit 1; }
          echo "MP4 sayisi: $count"
      - name: MP4leri indirilebilir yap
        uses: actions/upload-artifact@v6
        with:
          name: minik-kasifler-v3-MP4
          path: outputs/*.mp4
          if-no-files-found: error
          retention-days: 7
