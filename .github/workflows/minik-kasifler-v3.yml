
name: Minik Kasifler V3.2 - Dogal Ses

on:
  workflow_dispatch:
    inputs:
      bolum:
        description: Hangi egitici video?
        type: choice
        options:
          - renkler
          - sayilar
          - hayvanlar
          - sekiller
          - paylasma
        default: renkler

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      BOLUM: ${{ inputs.bolum }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}

    steps:
      - name: Node.js kur
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: FFmpeg kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Remotion kur
        run: |
          npm init -y
          npm install --no-audit --no-fund \
            remotion @remotion/cli react react-dom

      - name: Video motorunu hazirla
        shell: bash
        run: |
          mkdir -p public outputs

          cat > video.mjs <<'JS'
          import React from 'react';
          import {
            Composition, registerRoot,
            AbsoluteFill, Audio, Sequence,
            staticFile, useCurrentFrame,
            interpolate
          } from 'remotion';

          const data = {
            renkler: [
              'Renk Avı',
              'Kırmızı balon!',
              'Mavi balon!',
              'Sarı balon!',
              'Kırmızı, mavi, sarı!'
            ],
            sayilar: [
              'Sayı Treni',
              'Bir yıldız!',
              'İki yıldız!',
              'Üç yıldız!',
              'Bir, iki, üç!'
            ],
            hayvanlar: [
              'Hayvan Dostlar',
              'Kedi miyav der.',
              'Köpek hav hav der.',
              'Kuş cik cik der.',
              'Hayvanları öğrendik!'
            ],
            sekiller: [
              'Şekil Oyunu',
              'Bu bir daire.',
              'Bu bir kare.',
              'Bu bir üçgen.',
              'Daire, kare, üçgen!'
            ],
            paylasma: [
              'Arkadaşlık Günü',
              'Bir oyuncak bulduk.',
              'Bir arkadaşımız geldi.',
              'Sırayla oynayalım!',
              'Paylaşmak çok güzel!'
            ]
          };

          const palette = [
            '#8B5CF6', '#F87171',
            '#60A5FA', '#FBBF24', '#34D399'
          ];

          const Scene = ({text,color,index}) => {
            const frame = useCurrentFrame();
            const scale = interpolate(
              frame,[0,20,150,179],
              [0.85,1,1,0.95],
              {
                extrapolateLeft:'clamp',
                extrapolateRight:'clamp'
              }
            );

            return React.createElement(
              AbsoluteFill,
              {
                style:{
                  background:
                    `linear-gradient(160deg,${color},#292050)`,
                  color:'white',
                  justifyContent:'center',
                  alignItems:'center',
                  textAlign:'center',
                  padding:45,
                  fontFamily:'Arial,sans-serif'
                }
              },
              React.createElement(
                'div',
                {
                  style:{
                    fontSize:110,
                    marginBottom:40,
                    transform:`scale(${scale})`
                  }
                },
                ['✨','🎈','⭐','🌈','🎉'][index]
              ),
              React.createElement(
                'div',
                {
                  style:{
                    fontSize:65,
                    fontWeight:800,
                    lineHeight:1.3,
                    transform:`scale(${scale})`
                  }
                },
                text
              ),
              React.createElement(
                'div',
                {
                  style:{
                    position:'absolute',
                    bottom:90,
                    fontSize:28
                  }
                },
                'MİNİK KAŞİFLER'
              )
            );
          };

          const Video = ({bolum}) => {
            const lessons = data[bolum] || data.renkler;

            return React.createElement(
              AbsoluteFill,
              null,
              lessons.map((text,i) =>
                React.createElement(
                  Sequence,
                  {
                    key:i,
                    from:i*180,
                    durationInFrames:180
                  },
                  React.createElement(
                    Scene,
                    {
                      text,
                      color:palette[i],
                      index:i
                    }
                  ),
                  React.createElement(
                    Audio,
                    {src:staticFile(`ses${i}.mp3`)}
                  )
                )
              )
            );
          };

          registerRoot(() =>
            React.createElement(
              Composition,
              {
                id:'Ders',
                component:Video,
                durationInFrames:900,
                fps:30,
                width:720,
                height:1280,
                defaultProps:{bolum:'renkler'}
              }
            )
          );
          JS

      - name: Dogal Turkce sesleri olustur
        shell: bash
        run: |
          set -euo pipefail

          test -n "$ELEVENLABS_API_KEY" || {
            echo "ELEVENLABS_API_KEY eksik"
            exit 1
          }

          test -n "$ELEVENLABS_VOICE_ID" || {
            echo "ELEVENLABS_VOICE_ID eksik"
            exit 1
          }

          python3 - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          scripts = {
            "renkler": [
              "Merhaba minik kaşif! Renkleri bulalım!",
              "Bak! Kırmızı balon!",
              "Şimdi mavi balon!",
              "Yaşasın! Sarı balon da burada!",
              "Kırmızı, mavi, sarı! Harikasın!"
            ],
            "sayilar": [
              "Sayı trenine hoş geldin!",
              "Bir yıldız!",
              "İki yıldız!",
              "Üç yıldız!",
              "Bir, iki, üç! Aferin!"
            ],
            "hayvanlar": [
              "Hayvan dostlarımızı tanıyalım!",
              "Kedi miyav der!",
              "Köpek hav hav der!",
              "Kuş cik cik der!",
              "Hepsini öğrendik! Harika!"
            ],
            "sekiller": [
              "Haydi şekillerle oynayalım!",
              "Bu bir daire!",
              "Bak! Bu bir kare!",
              "İşte bir üçgen!",
              "Daire, kare, üçgen! Aferin!"
            ],
            "paylasma": [
              "Bugün arkadaşlık günü!",
              "Bir oyuncak bulduk!",
              "Arkadaşımız da oynamak istiyor!",
              "Haydi sırayla oynayalım!",
              "Paylaşmak çok güzel!"
            ]
          }

          lesson = os.environ["BOLUM"]
          key = os.environ["ELEVENLABS_API_KEY"]
          voice = os.environ["ELEVENLABS_VOICE_ID"]

          for i,text in enumerate(scripts[lesson]):
              url = (
                  "https://api.elevenlabs.io/v1/"
                  "text-to-speech/" + voice
              )
              body = json.dumps({
                  "text":text,
                  "model_id":"eleven_multilingual_v2",
                  "voice_settings":{
                      "stability":0.45,
                      "similarity_boost":0.75,
                      "style":0.25
                  }
              }).encode()

              request = urllib.request.Request(
                  url,
                  data=body,
                  headers={
                      "xi-api-key":key,
                      "Content-Type":"application/json",
                      "Accept":"audio/mpeg"
                  },
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(
                      request,timeout=120
                  ) as response:
                      audio=response.read()
              except urllib.error.HTTPError as error:
                  print("Ses API hatasi:",error.code)
                  raise

              if len(audio)<3000:
                  raise RuntimeError("Ses dosyasi bos")

              with open(
                  f"public/ses{i}.mp3","wb"
              ) as file:
                  file.write(audio)

              print(f"Ses {i+1} hazir")
          PY

          echo '{"bolum":"'"$BOLUM"'"}' > props.json

      - name: MP4 videoyu olustur
        run: |
          npx remotion render video.mjs Ders \
            outputs/minik-kasifler.mp4 \
            --props=props.json \
            --codec=h264 \
            --concurrency=2

          test -s outputs/minik-kasifler.mp4

      - name: Videoyu indirilebilir yap
        uses: actions/upload-artifact@v6
        with:
          name: minik-kasifler-dogal-ses
          path: outputs/*.mp4
          if-no-files-found: error
          retention-days: 7
