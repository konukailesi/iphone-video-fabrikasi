
name: Minik Kasifler V3.2 - Bolum ve Ses Secimi

on:
  workflow_dispatch:
    inputs:
      bolum:
        description: 'Video konusu'
        required: true
        type: choice
        default: renkler
        options:
          - renkler
          - sayilar
          - hayvanlar
          - sekiller
          - paylasma
      ses:
        description: 'ElevenLabs sesi'
        required: true
        type: choice
        default: kadin
        options:
          - kadin
          - erkek
          - sevimli

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BOLUM: ${{ inputs.bolum }}
      SES: ${{ inputs.ses }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      VOICE_KADIN: ${{ secrets.ELEVENLABS_VOICE_ID }}
      VOICE_ERKEK: ${{ secrets.ELEVENLABS_VOICE_ERKEK }}
      VOICE_SEVIMLI: ${{ secrets.ELEVENLABS_VOICE_SEVIMLI }}

    steps:
      - name: Node.js 24 kur
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: FFmpeg ve Turkce font kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-color-emoji fonts-dejavu-core
          ffmpeg -version | head -n 1

      - name: Remotion paketlerini kur
        run: |
          npm init -y
          npm install --no-audit --no-fund remotion @remotion/cli react react-dom

      - name: Video kodunu olustur
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src public outputs
          cat > src/index.jsx <<'REMOTION_JSX_END'
          import React from 'react';
          import {registerRoot, Composition, AbsoluteFill, Sequence, Audio, staticFile, useCurrentFrame, spring, useVideoConfig} from 'remotion';

          const lessons = {
            renkler: {
              title: 'Kayıp Balonlar',
              scenes: [
                ['🎈','Balonları bulalım!','#7c3aed'],
                ['🔴','KIRMIZI','#ef4444'],
                ['🔵','MAVİ','#2563eb'],
                ['🟡','SARI','#eab308'],
                ['🎈','Kırmızı • Mavi • Sarı','#14b8a6'],
              ],
            },
            sayilar: {
              title: 'Sayı Treni',
              scenes: [
                ['🚂','Haydi sayalım!','#7c3aed'],
                ['⭐','1 yıldız','#ec4899'],
                ['⭐⭐','2 yıldız','#2563eb'],
                ['⭐⭐⭐','3 yıldız','#f59e0b'],
                ['🌟','1 • 2 • 3','#14b8a6'],
              ],
            },
            hayvanlar: {
              title: 'Hayvan Dostlar',
              scenes: [
                ['🐾','Kimler burada?','#7c3aed'],
                ['🐱','KEDİ','#ec4899'],
                ['🐶','KÖPEK','#2563eb'],
                ['🐥','CİVCİV','#f59e0b'],
                ['🐱🐶🐥','Hayvan dostlarımız!','#14b8a6'],
              ],
            },
            sekiller: {
              title: 'Şekil Robotu',
              scenes: [
                ['🤖','Şekilleri bulalım!','#7c3aed'],
                ['🟠','DAİRE','#ec4899'],
                ['🟦','KARE','#2563eb'],
                ['🔺','ÜÇGEN','#f59e0b'],
                ['🤖','Daire • Kare • Üçgen','#14b8a6'],
              ],
            },
            paylasma: {
              title: 'Paylaşma Günü',
              scenes: [
                ['🐰','Bir oyuncak bulduk!','#7c3aed'],
                ['🧸','Oyuncağı seviyoruz.','#ec4899'],
                ['🐥','Arkadaşımız geldi!','#2563eb'],
                ['🤝','Sırayla oynayalım.','#f59e0b'],
                ['💛','Paylaşmak güzel!','#14b8a6'],
              ],
            },
          };

          const Scene = ({info, lessonTitle}) => {
            const frame = useCurrentFrame();
            const {fps} = useVideoConfig();
            const scale = spring({frame, fps, config:{damping:14, stiffness:90}});
            const bob = Math.sin(frame / 13) * 10;
            const [emoji, label, color] = info;
            return (
              <AbsoluteFill style={{background:`linear-gradient(155deg, ${color}, #231c51)`, padding:48, alignItems:'center', justifyContent:'center', color:'#fff', fontFamily:'DejaVu Sans, Arial, sans-serif', textAlign:'center'}}>
                <div style={{position:'absolute',top:90,fontSize:34,fontWeight:700,opacity:0.9}}>{lessonTitle}</div>
                <div style={{fontSize:175,transform:`translateY(${bob}px) scale(${Math.max(0.1,scale)})`,lineHeight:1.4}}>{emoji}</div>
                <div style={{fontSize:58,fontWeight:800,marginTop:45,lineHeight:1.3,textShadow:'0 3px 12px #0005'}}>{label}</div>
                <div style={{position:'absolute',bottom:85,fontSize:28,fontWeight:700,letterSpacing:2}}>MİNİK KAŞİFLER ✨</div>
              </AbsoluteFill>
            );
          };

          const Lesson = ({bolum}) => {
            const lesson = lessons[bolum] || lessons.renkler;
            return (
              <AbsoluteFill>
                {lesson.scenes.map((info, i) => (
                  <Sequence key={i} from={i * 240} durationInFrames={240}>
                    <Scene info={info} lessonTitle={lesson.title}/>
                    <Audio src={staticFile(`ses${i}.mp3`)}/>
                  </Sequence>
                ))}
              </AbsoluteFill>
            );
          };

          const Root = () => <Composition id="MinikDers" component={Lesson} durationInFrames={1200} fps={30} width={720} height={1280} defaultProps={{bolum:'renkler'}}/>;
          registerRoot(Root);
          REMOTION_JSX_END

      - name: Secilen dogal Turkce sesi olustur
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON_VOICE_END'
          import json, os, urllib.request, urllib.error, subprocess

          lines = {
            'renkler': [
              'Merhaba minik kaşif! Kayıp balonları birlikte bulalım!',
              'Bak, kırmızı bir balon! Kırmızıyı gösterebilir misin?',
              'Şimdi mavi balonu bulduk! Harika!',
              'İşte sarı balon! Haydi, sarı diyelim!',
              'Üç renk öğrendik: kırmızı, mavi, sarı. Aferin sana!'
            ],
            'sayilar': [
              'Sayı treni geliyor! Haydi birlikte sayalım!',
              'Bir yıldız! Bir!',
              'İki yıldız! Bir, iki!',
              'Üç yıldız! Bir, iki, üç!',
              'Harika saydın! Bir, iki, üç!'
            ],
            'hayvanlar': [
              'Hayvan dostlarımız saklanmış! Onları bulalım!',
              'Bu bir kedi. Miyav miyav!',
              'Bu bir köpek. Hav hav!',
              'Bu minik bir civciv. Cik cik!',
              'Kedi, köpek, civciv! Hepimiz arkadaşız!'
            ],
            'sekiller': [
              'Şekil robotumuza yardım edelim! Hazır mısın?',
              'Bu bir daire! Yuvarlak bir daire!',
              'Bu bir kare! Dört köşesi var!',
              'Bu bir üçgen! Üç köşesi var!',
              'Daire, kare, üçgen! Robotumuz tamamlandı!'
            ],
            'paylasma': [
              'Merhaba! Bugün paylaşmayı öğreniyoruz.',
              'Tavşanımız çok güzel bir oyuncak buldu.',
              'Civciv de bizimle oynamak istiyor.',
              'Haydi sırayla oynayalım! Önce sen, sonra ben.',
              'Paylaşmak ve arkadaş olmak çok güzel!'
            ],
          }
          voices = {
            'kadin': os.getenv('VOICE_KADIN',''),
            'erkek': os.getenv('VOICE_ERKEK',''),
            'sevimli': os.getenv('VOICE_SEVIMLI',''),
          }
          lesson = os.environ['BOLUM']
          voice_choice = os.environ['SES']
          api_key = os.getenv('ELEVENLABS_API_KEY','').strip()
          voice_id = voices[voice_choice].strip()
          if not api_key:
            raise SystemExit('HATA: ELEVENLABS_API_KEY secret eksik.')
          if not voice_id:
            raise SystemExit(f'HATA: {voice_choice} sesi icin Voice ID secret eksik.')

          for i, text in enumerate(lines[lesson]):
            url = f'https://api.elevenlabs.io/v1/text-to-speech/{voice_id}?output_format=mp3_44100_128'
            payload = json.dumps({
              'text':text,
              'model_id':'eleven_multilingual_v2',
              'voice_settings':{'stability':0.45,'similarity_boost':0.75,'style':0.2}
            }).encode('utf-8')
            req = urllib.request.Request(url, data=payload, method='POST', headers={
              'xi-api-key':api_key,
              'Content-Type':'application/json',
              'Accept':'audio/mpeg'
            })
            try:
              with urllib.request.urlopen(req, timeout=120) as result:
                audio = result.read()
            except urllib.error.HTTPError as error:
              print(f'ElevenLabs HTTP {error.code}: {error.read(500).decode("utf-8", "replace")}')
              raise
            if len(audio) < 1500:
              raise SystemExit(f'HATA: ses{i}.mp3 olusturulamadi.')
            filename = f'public/ses{i}.mp3'
            with open(filename,'wb') as f:
              f.write(audio)
            duration = float(subprocess.check_output([
              'ffprobe','-v','error','-show_entries','format=duration',
              '-of','default=noprint_wrappers=1:nokey=1',filename
            ]).decode().strip())
            print(f'Sahne {i+1}: ses suresi {duration:.1f} saniye')
            if duration > 7.9:
              raise SystemExit(f'HATA: {filename} 8 saniyeyi asiyor. Metni kisaltin.')

          with open('props.json','w',encoding='utf-8') as f:
            json.dump({'bolum':lesson},f)
          PYTHON_VOICE_END

      - name: MP4 olustur
        shell: bash
        run: |
          set -euo pipefail
          npx remotion render src/index.jsx MinikDers "outputs/${BOLUM}-${SES}.mp4" --props=props.json --codec=h264 --concurrency=2
          test -s "outputs/${BOLUM}-${SES}.mp4"
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 "outputs/${BOLUM}-${SES}.mp4"

      - name: MP4 dosyasini indirilebilir yap
        uses: actions/upload-artifact@v6
        with:
          name: minik-kasifler-v3-2-${{ inputs.bolum }}-${{ inputs.ses }}
          path: outputs/*.mp4
          if-no-files-found: error
          retention-days: 7
