name: Minik Kasifler V3 - Turkce Sesli
on:
  workflow_dispatch:
    inputs:
      kategori:
        description: Uretilecek bolum
        type: choice
        required: true
        default: karisik
        options:
          - karisik
          - 01-kayip-balonlar
          - 02-sayi-treni
          - 03-hayvan-dostlar
          - 04-sekil-robotu
          - 05-paylasma-gunu
      adet:
        description: Karisik secimde video adedi (1-5)
        type: number
        required: true
        default: 2
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      KATEGORI: ${{ inputs.kategori }}
      ADET: ${{ inputs.adet }}
    steps:
      - name: Projeyi getir
        uses: actions/checkout@v4
      - name: Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Turkce konusma motorunu kur
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng
      - name: Video motorunu ve sahneleri hazirla
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .
          cat > package.json <<'V3_PACKAGE_JSON_EOF'
          {
            "name":"minik-kasifler-v3",
            "version":"3.0.0",
            "private":true,
            "type":"module",
            "scripts":{"render":"node render.mjs","studio":"remotion studio src/index.jsx"},
            "dependencies":{"@remotion/cli":"4.0.415","remotion":"4.0.415","react":"18.3.1","react-dom":"18.3.1"}
          }
          V3_PACKAGE_JSON_EOF
          mkdir -p src
          cat > src/index.jsx <<'V3_SRC_INDEX_JSX_EOF'
          import React from 'react';
          import {registerRoot, Composition} from 'remotion';
          import {Episode} from './video.jsx';
          import {episodes} from './episodes.mjs';
          const FPS=30;
          const Root=()=> <Composition id="MinikKasifler" component={Episode} fps={FPS} width={720} height={1280} durationInFrames={48*FPS} defaultProps={{episode:episodes[0],audioEnabled:true}}/>;
          registerRoot(Root);
          V3_SRC_INDEX_JSX_EOF
          mkdir -p src
          cat > src/video.jsx <<'V3_SRC_VIDEO_JSX_EOF'
          import React from 'react';
          import {AbsoluteFill,Audio,Sequence,staticFile,useCurrentFrame,interpolate,spring,useVideoConfig} from 'remotion';
          
          const FPS=30;
          const lengths=[4,9,9,9,9,8];
          const FONT='Arial, "DejaVu Sans", sans-serif';
          const Txt=({children,size=52,color='#24435C',weight=900,style={}})=><div style={{fontFamily:FONT,fontSize:size,lineHeight:1.18,fontWeight:weight,color,textAlign:'center',overflowWrap:'break-word',...style}}>{children}</div>;
          function Bunny({size=210,blink=false}){return <svg width={size} height={size*1.15} viewBox="0 0 240 275" aria-label="Mavi tavşan"><path d="M54 130 Q26 32 62 22 Q91 11 103 117M137 117Q148 12 184 19Q219 39 179 132" fill="#86C9F5" stroke="#3E83B6" strokeWidth="9"/><path d="M65 104Q47 41 66 44Q83 49 84 105M155 107Q167 47 188 47Q192 67 170 110" fill="#FFD1D8"/><ellipse cx="121" cy="184" rx="95" ry="85" fill="#86C9F5" stroke="#3E83B6" strokeWidth="8"/><ellipse cx="82" cy="175" rx="10" ry={blink?2:14} fill="#274F72"/><ellipse cx="161" cy="175" rx="10" ry={blink?2:14} fill="#274F72"/><path d="M109 203L133 203L121 215Z" fill="#F48A9D"/><path d="M121 215Q109 233 96 220M121 215Q133 233 147 220" fill="none" stroke="#274F72" strokeWidth="5" strokeLinecap="round"/><circle cx="65" cy="211" r="13" fill="#FFC5D6"/><circle cx="179" cy="211" r="13" fill="#FFC5D6"/></svg>}
          function Chick({size=160}){return <svg width={size} height={size} viewBox="0 0 220 220" aria-label="Sarı civciv"><ellipse cx="110" cy="119" rx="92" ry="88" fill="#FFE476" stroke="#D9A53F" strokeWidth="8"/><path d="M88 36L104 10L119 39L137 16" fill="none" stroke="#D9A53F" strokeWidth="9" strokeLinecap="round"/><circle cx="80" cy="111" r="10" fill="#594837"/><circle cx="140" cy="111" r="10" fill="#594837"/><path d="M88 142L110 161L132 142Z" fill="#F69B4F"/><ellipse cx="56" cy="146" rx="14" ry="9" fill="#FFABAE"/><ellipse cx="165" cy="146" rx="14" ry="9" fill="#FFABAE"/></svg>}
          function Cat(){return <svg width="260" height="250" viewBox="0 0 260 250"><path d="M42 115L45 30L96 72Q132 57 165 72L213 30L220 115Q240 178 197 216Q132 257 65 216Q20 183 42 115Z" fill="#F9B777" stroke="#B27844" strokeWidth="8" strokeLinejoin="round"/><ellipse cx="90" cy="141" rx="10" ry="14" fill="#4E3A2B"/><ellipse cx="169" cy="141" rx="10" ry="14" fill="#4E3A2B"/><path d="M115 168L145 168L130 182Z" fill="#D87987"/><path d="M130 182Q115 199 102 188M130 182Q144 199 159 188M70 180H25M190 180H235" fill="none" stroke="#6E4C35" strokeWidth="5" strokeLinecap="round"/></svg>}
          function Fish(){return <svg width="280" height="240" viewBox="0 0 280 240"><path d="M70 115L15 65V170L70 128" fill="#6CC7FD" stroke="#267DB1" strokeWidth="7"/><ellipse cx="165" cy="120" rx="100" ry="70" fill="#6CC7FD" stroke="#267DB1" strokeWidth="7"/><circle cx="220" cy="103" r="11" fill="#254C65"/><path d="M230 142Q208 157 196 144" fill="none" stroke="#254C65" strokeWidth="6"/></svg>}
          function Duck(){return <svg width="260" height="245" viewBox="0 0 260 245"><ellipse cx="123" cy="156" rx="90" ry="66" fill="#FFE37D" stroke="#D4AE4C" strokeWidth="7"/><circle cx="161" cy="91" r="61" fill="#FFE37D" stroke="#D4AE4C" strokeWidth="7"/><circle cx="179" cy="79" r="9" fill="#51462F"/><path d="M203 110L250 126L205 141Z" fill="#F3A14A"/><path d="M106 207V231M152 210V231" stroke="#E59A41" strokeWidth="8"/></svg>}
          function Dog(){return <svg width="260" height="255" viewBox="0 0 260 255"><path d="M61 91Q5 28 16 165Q45 179 75 136M196 92Q250 25 251 154Q221 181 185 133" fill="#A8744C" stroke="#6C4A39" strokeWidth="8"/><ellipse cx="131" cy="141" rx="87" ry="91" fill="#DBAC78" stroke="#6C4A39" strokeWidth="8"/><circle cx="96" cy="128" r="11" fill="#3D342E"/><circle cx="166" cy="128" r="11" fill="#3D342E"/><ellipse cx="132" cy="168" rx="21" ry="14" fill="#3D342E"/><path d="M132 180Q120 208 102 188M132 180Q145 208 162 188" fill="none" stroke="#3D342E" strokeWidth="6"/></svg>}
          function Shape({shape='circle',color='#E97D68',size=300}){return <svg width={size} height={size} viewBox="0 0 300 300">{shape==='circle'?<circle cx="150" cy="150" r="115" fill={color} stroke="white" strokeWidth="14"/>:shape==='square'?<rect x="35" y="35" width="230" height="230" rx="18" fill={color} stroke="white" strokeWidth="14"/>:<path d="M150 26L280 265H20Z" fill={color} stroke="white" strokeWidth="14" strokeLinejoin="round"/>}</svg>}
          function Symbol({scene,reveal}){
           if(scene.kind==='color')return <div style={{display:'flex',gap:18,alignItems:'center'}}>{[scene.color,'#318BF2','#FFD43B'].filter((v,i,a)=>a.indexOf(v)===i).slice(0,3).map((c,i)=><div key={i} style={{width:scene.color===c&&reveal?185:152,height:scene.color===c&&reveal?210:180,background:c,border:'10px solid white',borderRadius:'52% 52% 48% 48%',boxShadow:'0 12px 22px #25415C33',position:'relative'}}><div style={{position:'absolute',bottom:-55,left:'50%',width:4,height:54,background:'#8291A0'}}/></div>)}</div>;
           if(scene.kind==='count')return <div style={{display:'flex',gap:18,flexWrap:'wrap',justifyContent:'center',maxWidth:510}}>{Array.from({length:scene.count},(_,i)=><div key={i} style={{fontSize:96,color:['#F5BC27','#E86B8B','#65B9E6','#83C98C'][i%4],textShadow:'0 5px white'}}>★</div>)}</div>;
           if(scene.kind==='animal')return scene.animal==='cat'?<Cat/>:scene.animal==='duck'?<Duck/>:scene.animal==='fish'?<Fish/>:<Dog/>;
           if(scene.kind==='shape')return <Shape shape={scene.shape} color={scene.shape==='circle'?'#F3A44D':scene.shape==='square'?'#73C5D8':'#A18AE8'}/>;
           if(scene.kind==='robot')return <div style={{display:'flex',flexDirection:'column',alignItems:'center'}}><div style={{width:155,height:155,background:'#80CBE3',border:'8px solid white',borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'space-evenly'}}><span style={{fontSize:45}}>•</span><span style={{fontSize:45}}>•</span></div><div style={{width:220,height:180,background:'#A48CED',border:'9px solid white',borderRadius:16,display:'grid',placeItems:'center',fontSize:64}}>★</div></div>;
           if(scene.kind==='feel')return <div style={{display:'flex',gap:15,alignItems:'center'}}><Bunny size={205}/><Chick size={170}/></div>;
           return <div style={{display:'flex',alignItems:'center',gap:8}}><Bunny size={195}/><Chick size={150}/></div>;
          }
          function SceneView({scene,episode,index,duration}){
           const f=useCurrentFrame(); const {fps}=useVideoConfig(); const reveal=f>=Math.round(duration*.64); const appear=spring({frame:f,fps,config:{damping:15,stiffness:115}});
           const float=Math.sin(f/15)*11;
           const intro=scene.kind==='intro'; const outro=scene.kind==='outro';
           return <AbsoluteFill style={{background:'#FFFAF2',overflow:'hidden',fontFamily:FONT}}>
