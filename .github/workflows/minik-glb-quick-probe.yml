name: Minik Kasifler - GLB Motion Quick Probe
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/minik-glb-quick-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe actual model skin and animations without Blender
        run: |
          python3 - <<'PY'
          import urllib.request,struct,json
          urls={
           'plush':'https://www.innerscene.com/api/library/plush-rabbit-b2b43520/download',
           'forest':'https://polyfork.dev/cdn/forest-rabbit-ea2da0.glb',
          }
          for name,url in urls.items():
           print('MODEL',name,flush=True)
           try:
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
            data=urllib.request.urlopen(req,timeout=25).read()
            print('DOWNLOAD',len(data),'MAGIC',data[:4],flush=True)
            if data[:4]!=b'glTF':continue
            size=struct.unpack('<I',data[12:16])[0]
            o=json.loads(data[20:20+size])
            print('GLTF',json.dumps({'nodes':len(o.get('nodes',[])),'skins':len(o.get('skins',[])),'animations':[a.get('name','unnamed') for a in o.get('animations',[])],'meshes':len(o.get('meshes',[])),'materials':[x.get('name') for x in o.get('materials',[])][:20]},ensure_ascii=False),flush=True)
           except Exception as e:print('ERROR',type(e).__name__,str(e),flush=True)
          PY
