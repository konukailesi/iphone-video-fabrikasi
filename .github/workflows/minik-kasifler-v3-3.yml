          if TEST=='C':
              for who in ('tavsan','civciv'):
                  if not Path(f'voice_refs/{who}.wav').is_file():
                      raise FileNotFoundError(f'C sesi icin voice_refs/{who}.wav gerekli. Referans sahibi izin vermis olmali.')
          
          print('Pocket TTS Turkish model yukleniyor...',flush=True)
          model=TurkishTTS.from_pretrained(device='cpu')
          refvoices={}
          if TEST=='C':
              for who in ('tavsan','civciv'):
                  refvoices[who]=model.voice_from_file(f'voice_refs/{who}.wav')
          
          out=Path('public');out.mkdir(exist_ok=True)
          Path('outputs').mkdir(exist_ok=True)
          
          # Ses testi de her iki karakteri seslendirir, boylece iki ayrik kayit dinlenir.
          if MODE=='ses_testi':
              scenes=[
                  ('tavsan','Merhaba minik arkadaşım! Kayıp balonları birlikte bulalım!','mutlu','MAVİ TAVŞAN','🐰','#845EC2'),
                  ('civciv','Aaa! Kırmızı balon burada! Yaşasın, başardık!','şaşkın','SARI CİVCİV','🐥','#F5B700')]
          else:
              scenes=LESSONS[BOLUM]
          
          metadata=[]
          for i,(who,text,emotion,heading,emoji,color) in enumerate(scenes):
              voice=refvoices[who] if TEST=='C' else VOICES[TEST][who]
              print(f'Ses {i+1}/{len(scenes)}: {who}, {emotion}',flush=True)
              audio=model.generate(text,voice=voice,emotion=emotion,seed=42+i)
              path=out/f'ses{i}.wav'
              save_wav(str(path),audio,model.sample_rate)
              with wave.open(str(path),'rb') as w:
                  dur=w.getnframes()/w.getframerate()
              if dur<0.25:raise ValueError(f'Ses bos: {path}')
              # Her sahnede tam ses bitmeden gorsel degismesin; cevabi dusunmek icin alan.
              sec=max(4.0,dur+1.25)
              metadata.append(dict(who=who,text=text,heading=heading,emoji=emoji,color=color,
                                   audio=f'ses{i}.wav',frames=math.ceil(sec*30),seconds=round(dur,2)))
          
          Path('public/scenes.json').write_text(json.dumps({'mode':MODE,'test':TEST,'bolum':BOLUM,'scenes':metadata},ensure_ascii=False,indent=2),encoding='utf-8')
          print('Ses sayisi:',len(metadata),'toplam saniye:',round(sum(x['frames'] for x in metadata)/30,1),flush=True)
          POCKET_TTS_PY_END
          cat > video.jsx <<'REMOTION_VIDEO_JSX_END'
          import React from 'react';
          import {Composition, registerRoot, AbsoluteFill, Audio, Sequence, staticFile, useCurrentFrame, interpolate} from 'remotion';
          import scenesData from './public/scenes.json';
          
          const fps=30;
          const sequences=scenesData.scenes;
          const total=sequences.reduce((sum,s)=>sum+s.frames,0);
          const Character=({who,frame})=>{
            const bounce=Math.sin(frame/10)*8;
            const happy=who==='tavsan';
            return <div style={{fontSize:150,transform:`translateY(${bounce}px)`,filter:'drop-shadow(0 12px 16px #0003)'}}>{happy?'🐰':'🐥'}</div>;
          };
          const Scene=({scene})=>{
            const frame=useCurrentFrame();
            const pop=interpolate(frame,[0,12,scene.frames-15,scene.frames-1],[0.7,1,1,0.94],{extrapolateLeft:'clamp',extrapolateRight:'clamp'});
            return <AbsoluteFill style={{background:`linear-gradient(160deg, ${scene.color}, #28315f)`,justifyContent:'center',alignItems:'center',fontFamily:'Arial, sans-serif',color:'white',textAlign:'center',padding:42}}>
              <div style={{position:'absolute',top:65,fontSize:32,fontWeight:800,letterSpacing:2}}>MİNİK KAŞİFLER</div>
              <Character who={scene.who} frame={frame}/>
              <div style={{fontSize:100,margin:30}}>{scene.emoji}</div>
              <div style={{fontSize:58,fontWeight:900,lineHeight:1.2,transform:`scale(${pop})`,textShadow:'0px 4px 9px #0006'}}>{scene.heading}</div>
              <div style={{position:'absolute',bottom:125,left:35,right:35,borderRadius:28,padding:'24px 15px',background:'#ffffffdd',color:'#29244d',fontSize:32,fontWeight:700,lineHeight:1.3}}>{scene.text}</div>
              <Audio src={staticFile(scene.audio)} />
            </AbsoluteFill>;
          };
          const Video=()=>{
            let start=0;
            return <AbsoluteFill>{sequences.map((scene,i)=>{const from=start;start+=scene.frames;return <Sequence key={i} from={from} durationInFrames={scene.frames}><Scene scene={scene}/></Sequence>})}</AbsoluteFill>;
          };
          const Root=()=> <Composition id="MinikKasifler" component={Video} durationInFrames={total} fps={fps} width={720} height={1280}/>;
          registerRoot(Root);
          REMOTION_VIDEO_JSX_END
      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Node.js 24 kur
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: FFmpeg kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: CPU ses modelini kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pocket-tts-turkish
      - name: Turkce sesleri olustur
        run: |
          set -euo pipefail
          python tts_v33.py
          test -s public/scenes.json
          test -s public/ses0.wav
      - name: Remotion paketlerini kur
        run: |
          npm init -y
          npm install --no-audit --no-fund remotion @remotion/cli react react-dom
      - name: MP4 render
        run: |
          set -euo pipefail
          npx remotion render video.jsx MinikKasifler "outputs/minik-kasifler-${BOLUM}-${MOD}-${SES_TESTI}.mp4" --codec=h264 --concurrency=2
          test -s "outputs/minik-kasifler-${BOLUM}-${MOD}-${SES_TESTI}.mp4"
          ffprobe -v error -show_entries stream=codec_name -of csv=p=0 "outputs/minik-kasifler-${BOLUM}-${MOD}-${SES_TESTI}.mp4" | grep -q h264
          ffprobe -v error -show_entries stream=codec_type -of csv=p=0 "outputs/minik-kasifler-${BOLUM}-${MOD}-${SES_TESTI}.mp4" | grep -q audio
      - name: Indirilebilir MP4 ve sesleri yukle
        uses: actions/upload-artifact@v6
        with:
          name: minik-kasifler-v33-${{ inputs.mod }}-${{ inputs.ses_testi }}
          path: |
            outputs/*.mp4
            public/ses*.wav
            public/scenes.json
          if-no-files-found: error
          retention-days: 7
