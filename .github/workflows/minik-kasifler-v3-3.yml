name: Minik Kasifler V3.3 - Tam Video ve Ses

on:
  workflow_dispatch:
    inputs:
      bolum:
        description: 'Video bolumu'
        type: choice
        required: true
        default: renkler
        options: [renkler, sayilar, hayvanlar, sekiller, paylasma]
      ses_testi:
        description: 'Ses secimi'
        type: choice
        required: true
        default: A
        options: [A, B, C]
      mod:
        description: 'Ses testi veya MP4 video'
        type: choice
        required: true
        default: video
        options: [video, ses_testi]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      BOLUM: ${{ inputs.bolum }}
      SES_TESTI: ${{ inputs.ses_testi }}
      MOD: ${{ inputs.mod }}
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Python ve Node kur
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: FFmpeg kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Pocket TTS kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pocket-tts-turkish
      - name: Proje dosyalarini olustur
        shell: bash
        run: |
          mkdir -p public outputs
          cat > tts.py <<'PY_END'
          import os,json,math,wave
          from pathlib import Path
          from pocket_tts_turkish import TurkishTTS,save_wav
          mode=os.getenv("MOD","ses_testi")
          test=os.getenv("SES_TESTI","A")
          lesson=os.getenv("BOLUM","renkler")
          texts={
          "renkler":[("tavsan","Merhaba! Balonları bulalım!","mutlu","Balon avı","🎈","#7c3aed"),("civciv","Bak! Kırmızı balon!","şaşkın","Kırmızı","🔴","#e5484d"),("tavsan","Mavi balon nerede?","şaşkın","Mavi nerede?","🔵","#3478d4"),("civciv","İşte mavi balon!","mutlu","Mavi","🔵","#3478d4"),("tavsan","Sarı balon da burada!","mutlu","Sarı","🟡","#e6ae23"),("civciv","Bir, iki, üç balon! Harikasın!","mutlu","Üç balon","🎉","#26a88c")],
          "sayilar":[("tavsan","Sayı trenimiz geliyor!","mutlu","Sayı treni","🚂","#7c3aed"),("civciv","Bir yıldız!","sakin","Bir","⭐","#e5484d"),("tavsan","İki yıldız!","mutlu","İki","⭐⭐","#3478d4"),("civciv","Üç yıldız!","mutlu","Üç","⭐⭐⭐","#e6ae23"),("tavsan","Haydi birlikte sayalım!","şaşkın","Sayalım","🌟","#7c3aed"),("civciv","Bir, iki, üç! Bravo!","mutlu","Bravo","🎉","#26a88c")],
          "hayvanlar":[("tavsan","Hayvan dostlarımızı bulalım!","mutlu","Hayvanlar","🐾","#7c3aed"),("civciv","Miyav diyen kim? Kedi!","şaşkın","Kedi","🐱","#e5484d"),("tavsan","Hav hav diyen kim? Köpek!","mutlu","Köpek","🐶","#3478d4"),("civciv","Cik cik! Civciv!","mutlu","Civciv","🐥","#e6ae23"),("tavsan","Suda kim yüzüyor? Balık!","şaşkın","Balık","🐟","#7c3aed"),("civciv","Hepsi bizim arkadaşımız!","mutlu","Arkadaşlar","💛","#26a88c")],
          "sekiller":[("tavsan","Şekilleri bulalım!","mutlu","Şekiller","🔷","#7c3aed"),("civciv","Yuvarlak daire!","sakin","Daire","🟠","#e5484d"),("tavsan","Bu bir kare!","mutlu","Kare","🟦","#3478d4"),("civciv","Üç köşeli üçgen!","mutlu","Üçgen","🔺","#e6ae23"),("tavsan","Şekilleri tanıdın mı?","şaşkın","Hatırla","❓","#7c3aed"),("civciv","Daire, kare, üçgen!","mutlu","Harika","🎉","#26a88c")],
          "paylasma":[("tavsan","Yeni bir oyuncak buldum!","şaşkın","Oyuncak","🧸","#7c3aed"),("civciv","Ben de oynayabilir miyim?","sakin","Arkadaşlık","🐥","#e5484d"),("tavsan","Elbette! Sırayla oynayalım.","mutlu","Sırayla","🤝","#3478d4"),("civciv","Teşekkür ederim!","mutlu","Teşekkürler","💛","#e6ae23"),("tavsan","Birlikte oynamak güzel!","mutlu","Birlikte","🐰","#7c3aed"),("civciv","Paylaşmayı öğrendik!","mutlu","Bravo","🎉","#26a88c")]
          }
          if mode not in ("ses_testi","video") or test not in ("A","B","C") or lesson not in texts: raise SystemExit("Gecersiz secim")
          scenes=([("tavsan","Merhaba minik arkadaşım! Ben Mavi Tavşan!","mutlu","Mavi Tavşan","🐰","#7c3aed"),("civciv","Yaşasın! Ben Sarı Civciv!","şaşkın","Sarı Civciv","🐥","#e6ae23")] if mode=="ses_testi" else texts[lesson])
          voices={"A":{"tavsan":"female_1","civciv":"female_2"},"B":{"tavsan":"female_2","civciv":"female_3"}}
          if test=="C":
           for who in ("tavsan","civciv"):
            if not Path("voice_refs/"+who+".wav").is_file(): raise SystemExit("C icin voice_refs/"+who+".wav eksik. Herkese acik depoya ozel kayit yuklemeyin.")
          print("Pocket TTS modeli yukleniyor",flush=True)
          model=TurkishTTS.from_pretrained(device="cpu")
          reference={who:model.voice_from_file("voice_refs/"+who+".wav") for who in ("tavsan","civciv")} if test=="C" else {}
          Path("public").mkdir(exist_ok=True)
          Path("outputs").mkdir(exist_ok=True)
          result=[]
          for i,(who,spoken,emotion,title,emoji,color) in enumerate(scenes):
           voice=reference[who] if test=="C" else voices[test][who]
           print("Konusma",i+1,"/",len(scenes),who,flush=True)
           audio=model.generate(spoken,voice=voice,emotion=emotion,seed=42+i)
           filename=f"public/ses{i}.wav"
           save_wav(filename,audio,model.sample_rate)
           with wave.open(filename,"rb") as f: duration=f.getnframes()/f.getframerate()
           if duration<0.2: raise RuntimeError("Bos ses dosyasi: "+filename)
           result.append({"who":who,"text":spoken,"heading":title,"emoji":emoji,"color":color,"audio":f"ses{i}.wav","frames":math.ceil(max(4,duration+1.5)*30)})
          Path("public/scenes.json").write_text(json.dumps(result,ensure_ascii=False),encoding="utf-8")
          print("Hazir sahneler:",len(result),flush=True)
          PY_END
          cat > video.jsx <<'JS_END'
          import React from 'react';
          import {Composition,registerRoot,AbsoluteFill,Audio,Sequence,staticFile,useCurrentFrame,interpolate} from 'remotion';
          import scenes from './public/scenes.json';
          const total=scenes.reduce((sum,s)=>sum+s.frames,0);
          const Scene=({s})=>{const f=useCurrentFrame();const scale=interpolate(f,[0,12],[0.85,1],{extrapolateRight:'clamp'});return <AbsoluteFill style={{background:`linear-gradient(155deg,${s.color},#22224c)`,alignItems:'center',justifyContent:'center',padding:40,color:'#fff',fontFamily:'Arial,sans-serif',textAlign:'center'}}><div style={{position:'absolute',top:75,fontSize:30,fontWeight:700}}>MİNİK KAŞİFLER</div><div style={{fontSize:150}}>{s.who==='tavsan'?'🐰':'🐥'}</div><div style={{fontSize:115}}>{s.emoji}</div><div style={{fontSize:58,fontWeight:800,transform:`scale(${scale})`}}>{s.heading}</div><div style={{position:'absolute',bottom:100,left:30,right:30,background:'#fff',color:'#25254b',borderRadius:26,padding:20,fontSize:31}}>{s.text}</div><Audio src={staticFile(s.audio)}/></AbsoluteFill>};
          const Video=()=>{let start=0;return <AbsoluteFill>{scenes.map((s,i)=>{let from=start;start+=s.frames;return <Sequence key={i} from={from} durationInFrames={s.frames}><Scene s={s}/></Sequence>})}</AbsoluteFill>};
          registerRoot(()=> <Composition id="MinikKasifler" component={Video} durationInFrames={total} fps={30} width={720} height={1280}/>);
          JS_END
      - name: Sesleri olustur
        run: |
          set -euo pipefail
          python tts.py
          test -s public/scenes.json
          test -s public/ses0.wav
      - name: Remotion kur
        run: |
          npm init -y
          npm install --no-audit --no-fund remotion @remotion/cli react react-dom
      - name: MP4 olustur
        shell: bash
        run: |
          set -euo pipefail
          npx remotion render video.jsx MinikKasifler "outputs/${BOLUM}-${SES_TESTI}-${MOD}.mp4" --codec=h264 --concurrency=2
          test -s "outputs/${BOLUM}-${SES_TESTI}-${MOD}.mp4"
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=noprint_wrappers=1 "outputs/${BOLUM}-${SES_TESTI}-${MOD}.mp4" | grep -q h264
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of default=noprint_wrappers=1 "outputs/${BOLUM}-${SES_TESTI}-${MOD}.mp4" | grep -q audio
      - name: MP4 ve WAV indirilebilir yap
        uses: actions/upload-artifact@v6
        with:
          name: minik-kasifler-v33-${{ inputs.bolum }}-${{ inputs.ses_testi }}-${{ inputs.mod }}
          path: |
            outputs/*.mp4
            public/ses*.wav
          if-no-files-found: error
          retention-days: 7
