name: Minik Kasifler V3.3 - Pocket TTS

on:
  workflow_dispatch:
    inputs:
      bolum:
        description: "Egitici bolum"
        required: true
        type: choice
        default: renkler
        options: [renkler, sayilar, hayvanlar, sekiller, paylasma]
      ses_testi:
        description: "Ses kombinasyonu"
        required: true
        type: choice
        default: A
        options: [A, B, C]
      mod:
        description: "Yalnizca iki ses dene veya tam video uret"
        required: true
        type: choice
        default: ses_testi
        options: [ses_testi, video]
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BOLUM: ${{ inputs.bolum }}
      SES_TESTI: ${{ inputs.ses_testi }}
      MOD: ${{ inputs.mod }}
      HF_HUB_DISABLE_TELEMETRY: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - name: Dosyalari al
        uses: actions/checkout@v4
      - name: Proje kodunu olustur
        shell: bash
        run: |
          mkdir -p public outputs voice_refs
          cat > tts_v33.py <<'POCKET_TTS_PY_END'
          import json, os, math, wave, subprocess
          from pathlib import Path
          from pocket_tts_turkish import TurkishTTS, save_wav
          
          MODE=os.environ.get('MOD','ses_testi')
          TEST=os.environ.get('SES_TESTI','A')
          BOLUM=os.environ.get('BOLUM','renkler')
          if MODE not in ('ses_testi','video'): raise ValueError('Gecersiz mod')
          if TEST not in ('A','B','C'): raise ValueError('Gecersiz ses testi')
          
