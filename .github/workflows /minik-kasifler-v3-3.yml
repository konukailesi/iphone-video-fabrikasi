name: Minik Kasifler V3.3 - Pocket TTS

on:
  workflow_dispatch:
    inputs:
      ses_testi:
        description: "Ses kombinasyonu"
        type: choice
        required: true
        default: A
        options:
          - A
          - B
          - C
      mod:
        description: "Uretim modu"
        type: choice
        default: ses_testi
        options:
          - ses_testi
          - video
      bolum:
        description: "Egitici bolum"
        type: choice
        default: renkler
        options:
          - renkler
          - sayilar
          - hayvanlar
          - sekiller
          - paylasma
